<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Кафе-радар Хабаровск</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f4f0; --panel:#ffffff; --panel-2:#f1eee8; --line:#e4dfd6;
  --text:#1d1b18; --muted:#77706a; --accent:#c2410c; --accent-soft:#fde7d8;
  --shadow:0 10px 30px rgba(40,30,20,.12);
  --s-new:#9ca3af; --s-plan:#3b82f6; --s-contacted:#f59e0b; --s-interested:#8b5cf6; --s-client:#16a34a; --s-rejected:#dc2626;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141311; --panel:#1d1b19; --panel-2:#262320; --line:#34302c;
    --text:#f2eee9; --muted:#a39b93; --accent:#fb923c; --accent-soft:#3a2518;
    --shadow:0 10px 30px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  --bg:#141311; --panel:#1d1b19; --panel-2:#262320; --line:#34302c;
  --text:#f2eee9; --muted:#a39b93; --accent:#fb923c; --accent-soft:#3a2518;
  --shadow:0 10px 30px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:Manrope,system-ui,-apple-system,Segoe UI,sans-serif;font-size:14px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.app{display:grid;grid-template-rows:auto 1fr;height:100dvh}
header{display:flex;align-items:center;gap:14px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line);z-index:1001}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:16px;white-space:nowrap}
.logo-mark{width:32px;height:32px;border-radius:10px;background:var(--accent);display:grid;place-items:center;color:#fff;font-size:18px}
.logo small{display:block;font-weight:500;font-size:11px;color:var(--muted)}
.stats{display:flex;gap:6px;flex-wrap:nowrap;overflow-x:auto;margin-left:auto;scrollbar-width:none}
.stats::-webkit-scrollbar{display:none}
.stat{display:flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;background:var(--panel-2);font-size:12px;font-weight:600;white-space:nowrap}
.stat i{width:8px;height:8px;border-radius:50%;display:inline-block}
.icon-btn{border:1px solid var(--line);background:var(--panel);border-radius:10px;height:34px;min-width:34px;padding:0 10px;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:600}
.icon-btn:hover{background:var(--panel-2)}
.main{display:grid;grid-template-columns:400px 1fr;min-height:0;position:relative}
aside{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;position:relative;z-index:1000}
.controls{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.search{display:flex;align-items:center;gap:8px;background:var(--panel-2);border-radius:12px;padding:0 12px;height:40px}
.search input{border:0;background:transparent;outline:none;flex:1;min-width:0}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:6px;color:var(--muted)}
.chip i{width:8px;height:8px;border-radius:50%}
.chip.on{background:var(--text);color:var(--panel);border-color:var(--text)}
.row{display:flex;gap:8px;align-items:center}
.row label{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);font-weight:600}
.row select{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:4px 8px;font-size:12px}
.list{overflow-y:auto;flex:1;min-height:0}
.item{display:flex;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer;align-items:flex-start}
.item:hover{background:var(--panel-2)}
.item.active{background:var(--accent-soft)}
.dot{width:12px;height:12px;border-radius:50%;flex:none;margin-top:4px;box-shadow:0 0 0 3px var(--panel)}
.item-body{min-width:0;flex:1}
.item-title{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item-sub{color:var(--muted);font-size:12px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item-note{font-size:12px;margin-top:4px;color:var(--text);opacity:.8;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tag{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);background:var(--panel-2);border-radius:6px;padding:2px 6px;flex:none}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--text);font-size:15px;margin-bottom:6px}
.footer-bar{padding:8px 14px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:8px;align-items:center}
#map{height:100%;width:100%;background:var(--panel-2)}
/* detail drawer */
.detail{position:absolute;inset:0;background:var(--panel);display:flex;flex-direction:column;transform:translateX(-102%);transition:transform .22s ease;z-index:5}
.detail.open{transform:none}
.detail-head{padding:14px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
.detail-head h2{margin:0;font-size:18px;line-height:1.25}
.detail-head .sub{color:var(--muted);font-size:12px;margin-top:4px}
.detail-body{overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:16px;flex:1}
.section-title{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;margin-bottom:8px}
.status-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.status-btn{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 6px;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px}
.status-btn i{width:9px;height:9px;border-radius:50%}
.status-btn.on{border-color:currentColor;box-shadow:inset 0 0 0 1px currentColor}
.info{display:flex;flex-direction:column;gap:2px;background:var(--panel-2);border-radius:12px;overflow:hidden}
.info-row{display:flex;gap:10px;padding:10px 12px;align-items:flex-start;background:var(--panel-2)}
.info-row+.info-row{border-top:1px solid var(--line)}
.info-row span:first-child{width:20px;flex:none;text-align:center}
.info-row a{color:var(--accent);text-decoration:none;word-break:break-all}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{border:0;border-radius:10px;padding:10px 12px;font-weight:700;background:var(--panel-2);text-align:center;text-decoration:none;color:var(--text);display:flex;align-items:center;justify-content:center;gap:6px;font-size:13px}
.btn.primary{background:var(--accent);color:#fff}
.btn:hover{filter:brightness(.96)}
.field{display:flex;flex-direction:column;gap:6px}
.field input,.field textarea{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:9px 11px;outline:none;width:100%}
.field input:focus,.field textarea:focus{border-color:var(--accent)}
.field textarea{min-height:90px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.history{display:flex;flex-direction:column;gap:6px;font-size:12px}
.history div{display:flex;gap:8px;color:var(--muted)}
.history b{color:var(--text);font-weight:600}
/* markers */
.pin{width:16px;height:16px;border-radius:50%;border:2.5px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.pin.sel{width:22px;height:22px;margin:-3px 0 0 -3px;outline:3px solid var(--accent)}
.marker-cluster-small,.marker-cluster-medium,.marker-cluster-large{background:rgba(194,65,12,.25)!important}
.marker-cluster div{border-radius:50%;width:30px;height:30px;margin:5px;display:grid;place-items:center}
.marker-cluster{border-radius:50%}
@media (max-width:820px){.hide-sm{display:none}}
.marker-cluster-small div,.marker-cluster-medium div,.marker-cluster-large div{background:var(--accent)!important;color:#fff!important;font-family:Manrope,sans-serif;font-weight:800}
.leaflet-container{font-family:Manrope,system-ui,sans-serif}
.loader{position:absolute;left:50%;top:16px;transform:translateX(-50%);background:var(--panel);box-shadow:var(--shadow);border-radius:999px;padding:8px 16px;font-weight:600;z-index:999;display:none;align-items:center;gap:8px}
.loader.show{display:flex}
.spin{width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.map-wrap{position:relative;min-height:0}
.add-hint{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);background:var(--text);color:var(--panel);border-radius:999px;padding:10px 18px;font-weight:700;z-index:999;display:none}
.add-hint.show{display:block}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--panel);padding:10px 16px;border-radius:12px;font-weight:600;opacity:0;pointer-events:none;transition:.2s;z-index:3000;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translateX(-50%)}
/* menu */
.menu{position:absolute;right:16px;top:54px;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;display:none;flex-direction:column;min-width:230px;z-index:2000}
.menu.show{display:flex}
.menu button{border:0;background:transparent;text-align:left;padding:9px 10px;border-radius:8px;font-weight:600}
.menu button:hover{background:var(--panel-2)}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 0}
.mobile-toggle{display:none}
@media (max-width: 820px){
  header{padding:8px 12px;gap:10px}
  .logo small{display:none}
  .stats{display:none}
  .header-spacer{margin-left:auto}
  .main{grid-template-columns:1fr}
  aside{position:absolute;left:0;right:0;bottom:0;height:62%;border-right:0;border-top:1px solid var(--line);border-radius:18px 18px 0 0;box-shadow:var(--shadow);transform:translateY(calc(100% - 56px));transition:transform .25s ease;overflow:hidden}
  aside.expanded{transform:none}
  .detail{transform:translateY(102%)}
  .detail.open{transform:none}
  .grab{display:flex!important}
  .map-wrap{height:100%}
  .menu{right:12px}
}
.grab{display:none;align-items:center;justify-content:space-between;padding:8px 14px;height:56px;border-bottom:1px solid var(--line);font-weight:700;cursor:pointer;flex:none}
.grab::before{content:"";position:absolute;left:50%;top:6px;width:36px;height:4px;border-radius:4px;background:var(--line);transform:translateX(-50%)}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">
      <div class="logo-mark">☕</div>
      <div>Кафе-радар<small>Хабаровск · поиск клиентов</small></div>
    </div>
    <div class="stats" id="stats"></div>
    <div class="header-spacer"></div>
    <button class="icon-btn" id="addBtn" title="Добавить своё место на карту">＋ <span class="hide-sm">Место</span></button>
    <button class="icon-btn" id="menuBtn" title="Меню">⋯</button>
    <div class="menu" id="menu">
      <button data-act="reload">🔄 Обновить данные с карты</button>
      <button data-act="csv">📊 Выгрузить в Excel (CSV)</button>
      <hr>
      <button data-act="backup">💾 Сохранить резервную копию</button>
      <button data-act="restore">📂 Загрузить резервную копию</button>
      <hr>
      <button data-act="theme">🌓 Сменить тему</button>
    </div>
    <input type="file" id="fileIn" accept=".json,application/json" hidden>
  </header>

  <div class="main">
    <aside id="aside">
      <div class="grab" id="grab"><span id="grabText">Список</span><span style="color:var(--muted);font-size:12px">нажмите ↕</span></div>
      <div class="controls">
        <div class="search">🔎<input id="q" placeholder="Название, улица, телефон, заметка…" autocomplete="off"></div>
        <div class="chips" id="statusChips"></div>
        <div class="chips" id="typeChips"></div>
        <div class="row">
          <label><input type="checkbox" id="onlyPhone"> только с телефоном</label>
          <label style="margin-left:auto">Сорт.
            <select id="sort">
              <option value="name">по названию</option>
              <option value="updated">по последнему действию</option>
              <option value="status">по статусу</option>
              <option value="distance">ближе к центру карты</option>
            </select>
          </label>
        </div>
      </div>
      <div class="list" id="list"></div>
      <div class="footer-bar"><span id="count"></span><span id="updatedAt"></span></div>

      <div class="detail" id="detail"></div>
    </aside>

    <div class="map-wrap">
      <div id="map"></div>
      <div class="loader" id="loader"><div class="spin"></div><span id="loaderText">Загружаю кафе…</span></div>
      <div class="add-hint" id="addHint">Нажмите на карту, чтобы поставить точку · Esc — отмена</div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.min.js"></script>
<script>
(() => {
'use strict';

// ---------- Константы ----------
const CITY_CENTER = [48.4808, 135.0928];
// Границы Хабаровска (юг, запад, север, восток)
const BBOX = [48.33, 134.93, 48.62, 135.26];
const OVERPASS = [
  'https://overpass-api.de/api/interpreter',
  'https://maps.mail.ru/osm/tools/overpass/api/interpreter',
  'https://overpass.kumi.systems/api/interpreter',
  'https://overpass.private.coffee/api/interpreter'
];
const STATUSES = {
  new:        {label:'Не обработан', color:'var(--s-new)',        hex:'#9ca3af'},
  plan:       {label:'В планах',     color:'var(--s-plan)',       hex:'#3b82f6'},
  contacted:  {label:'Связался',     color:'var(--s-contacted)',  hex:'#f59e0b'},
  interested: {label:'Интерес',      color:'var(--s-interested)', hex:'#8b5cf6'},
  client:     {label:'Клиент',       color:'var(--s-client)',     hex:'#16a34a'},
  rejected:   {label:'Отказ',        color:'var(--s-rejected)',   hex:'#dc2626'}
};
const TYPES = {
  cafe:       'Кафе',
  coffee:     'Кофейни',
  restaurant: 'Рестораны',
  fast_food:  'Фастфуд',
  bar:        'Бары',
  custom:     'Мои точки'
};
const DEFAULT_TYPES = ['cafe','coffee','custom'];
const LS = {places:'kr_places_v1', crm:'kr_crm_v1', ui:'kr_ui_v1', theme:'kr_theme'};

// ---------- Хранилище ----------
const store = {
  get(k, def){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : def; }catch(e){ return def; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){ toast('Не удалось сохранить: память браузера недоступна'); } }
};

let placesData = store.get(LS.places, null); // {fetchedAt, items:[...]}
let crm = store.get(LS.crm, {});              // id -> {status, note, person, nextDate, updated, history:[]}
let custom = (crm.__custom || []);            // свои точки
const ui = Object.assign({statuses:[], types:DEFAULT_TYPES.slice(), q:'', onlyPhone:false, sort:'name'}, store.get(LS.ui, {}));

const theme = store.get(LS.theme, null);
if (theme) document.documentElement.dataset.theme = theme;

// ---------- Утилиты ----------
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let toastT;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2600); }
const fmtDate = ts => new Date(ts).toLocaleDateString('ru-RU',{day:'2-digit',month:'short',year:'numeric'});
const fmtDT = ts => new Date(ts).toLocaleString('ru-RU',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
const saveCrm = () => { crm.__custom = custom; store.set(LS.crm, crm); };
const saveUi = () => store.set(LS.ui, ui);
const telHref = p => 'tel:' + p.replace(/[^\d+]/g,'');

function normalize(el){
  const t = el.tags || {};
  const lat = el.lat ?? el.center?.lat, lon = el.lon ?? el.center?.lon;
  if (lat == null || !t.name) return null;
  let type = t.amenity;
  if (type === 'pub') type = 'bar';
  if (type === 'cafe' && (/coffee/i.test(t.cuisine||'') || /коф|coffee/i.test(t.name))) type = 'coffee';
  const street = t['addr:street'], hn = t['addr:housenumber'];
  const phone = t.phone || t['contact:phone'] || '';
  return {
    id: el.type[0] + el.id,
    name: t.name,
    type, lat, lon,
    addr: street ? (street + (hn ? ', ' + hn : '')) : '',
    phone: phone.split(';')[0].trim(),
    phones: phone,
    website: t.website || t['contact:website'] || '',
    vk: t['contact:vk'] || '',
    insta: t['contact:instagram'] || '',
    tg: t['contact:telegram'] || '',
    email: t.email || t['contact:email'] || '',
    hours: t.opening_hours || '',
    cuisine: t.cuisine || '',
    brand: t.brand || ''
  };
}

async function fetchPlaces(){
  const [s,w,n,e] = BBOX;
  const q = `[out:json][timeout:90];(nwr["amenity"~"^(cafe|restaurant|fast_food|bar|pub)$"]["name"](${s},${w},${n},${e}););out center tags;`;
  let lastErr;
  for (const url of OVERPASS){
    try{
      const ctrl = new AbortController(); const tm = setTimeout(()=>ctrl.abort(), 60000);
      const r = await fetch(url, {method:'POST', body:'data='+encodeURIComponent(q), headers:{'Content-Type':'application/x-www-form-urlencoded'}, signal:ctrl.signal});
      clearTimeout(tm);
      if (!r.ok) throw new Error('HTTP '+r.status);
      const j = await r.json();
      const items = (j.elements||[]).map(normalize).filter(Boolean);
      if (!items.length) throw new Error('пустой ответ');
      return {fetchedAt: Date.now(), items};
    }catch(e){ lastErr = e; }
  }
  throw lastErr || new Error('нет ответа');
}

async function loadPlaces(force){
  if (placesData && !force){ return; }
  $('#loader').classList.add('show'); $('#loaderText').textContent = 'Загружаю кафе Хабаровска…';
  try{
    placesData = await fetchPlaces();
    store.set(LS.places, placesData);
    toast(`Загружено мест: ${placesData.items.length}`);
  }catch(e){
    toast('Не удалось загрузить данные. Проверьте интернет и попробуйте «Обновить» в меню.');
    if (!placesData) placesData = {fetchedAt:0, items:[]};
  }finally{
    $('#loader').classList.remove('show');
  }
}

const allPlaces = () => [...(placesData?.items||[]), ...custom];
const getStatus = id => crm[id]?.status || 'new';
const byId = id => allPlaces().find(p => p.id === id);

// ---------- Карта ----------
const map = L.map('map', {zoomControl:false, preferCanvas:false}).setView(CITY_CENTER, 13);
L.control.zoom({position:'topright'}).addTo(map);
let tileLayer;
function isDark(){
  const t = document.documentElement.dataset.theme;
  return t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
}
function setTiles(){
  if (tileLayer) map.removeLayer(tileLayer);
  const style = isDark() ? 'dark_all' : 'rastertiles/voyager';
  tileLayer = L.tileLayer(`https://{s}.basemaps.cartocdn.com/${style}/{z}/{x}/{y}{r}.png`, {
    subdomains:'abcd', maxZoom:20,
    attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions">CARTO</a>'
  }).addTo(map);
}
setTiles();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', setTiles);

const cluster = L.markerClusterGroup({showCoverageOnHover:false, maxClusterRadius:42, disableClusteringAtZoom:17});
map.addLayer(cluster);
const markers = new Map();
let selectedId = null;

const pinIcon = (id) => L.divIcon({
  className:'', iconSize:[16,16], iconAnchor:[8,8],
  html:`<div class="pin ${id===selectedId?'sel':''}" style="background:${STATUSES[getStatus(id)].hex}"></div>`
});

// ---------- Фильтрация ----------
function filtered(){
  const q = ui.q.trim().toLowerCase();
  const c = map.getCenter();
  let arr = allPlaces().filter(p => {
    if (ui.types.length && !ui.types.includes(p.type)) return false;
    if (ui.statuses.length && !ui.statuses.includes(getStatus(p.id))) return false;
    if (ui.onlyPhone && !p.phone) return false;
    if (q){
      const hay = [p.name, p.addr, p.phones, p.brand, crm[p.id]?.note, crm[p.id]?.person].join(' ').toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
  const order = Object.keys(STATUSES);
  const sorters = {
    name: (a,b) => a.name.localeCompare(b.name,'ru'),
    updated: (a,b) => (crm[b.id]?.updated||0) - (crm[a.id]?.updated||0) || a.name.localeCompare(b.name,'ru'),
    status: (a,b) => order.indexOf(getStatus(b.id)) - order.indexOf(getStatus(a.id)) || a.name.localeCompare(b.name,'ru'),
    distance: (a,b) => c.distanceTo([a.lat,a.lon]) - c.distanceTo([b.lat,b.lon])
  };
  return arr.sort(sorters[ui.sort] || sorters.name);
}

// ---------- Отрисовка ----------
function renderChips(){
  const counts = {}; allPlaces().forEach(p => { const s=getStatus(p.id); counts[s]=(counts[s]||0)+1; });
  $('#statusChips').innerHTML = Object.entries(STATUSES).map(([k,s]) =>
    `<button class="chip ${ui.statuses.includes(k)?'on':''}" data-status="${k}"><i style="background:${s.color}"></i>${s.label} ${counts[k]||0}</button>`).join('');
  const tcounts = {}; allPlaces().forEach(p => tcounts[p.type]=(tcounts[p.type]||0)+1);
  $('#typeChips').innerHTML = Object.entries(TYPES).filter(([k]) => k!=='custom' || custom.length).map(([k,l]) =>
    `<button class="chip ${ui.types.includes(k)?'on':''}" data-type="${k}">${l} ${tcounts[k]||0}</button>`).join('');
  $('#stats').innerHTML = ['client','interested','contacted','plan'].map(k =>
    `<div class="stat"><i style="background:${STATUSES[k].color}"></i>${STATUSES[k].label}: ${counts[k]||0}</div>`).join('');
}

function renderList(){
  const arr = filtered();
  const list = $('#list');
  if (!allPlaces().length){
    list.innerHTML = `<div class="empty"><b>Пока пусто</b>Данные ещё не загрузились. Откройте меню ⋯ → «Обновить данные с карты».</div>`;
  } else if (!arr.length){
    list.innerHTML = `<div class="empty"><b>Ничего не найдено</b>Попробуйте убрать фильтры или изменить поиск.</div>`;
  } else {
    list.innerHTML = arr.slice(0, 600).map(p => {
      const c = crm[p.id];
      return `<div class="item ${p.id===selectedId?'active':''}" data-id="${p.id}">
        <span class="dot" style="background:${STATUSES[getStatus(p.id)].color}"></span>
        <div class="item-body">
          <div class="item-title">${esc(p.name)}</div>
          <div class="item-sub">${esc(p.addr || 'адрес не указан')}${p.phone ? ' · '+esc(p.phone) : ''}</div>
          ${c?.note ? `<div class="item-note">📝 ${esc(c.note)}</div>` : ''}
          ${c?.nextDate ? `<div class="item-sub">⏰ ${esc(fmtDate(c.nextDate))}</div>` : ''}
        </div>
        <span class="tag">${esc(TYPES[p.type]?.replace(/и$|ы$/,'') || p.type)}</span>
      </div>`;
    }).join('') + (arr.length > 600 ? `<div class="empty">Показаны первые 600 из ${arr.length}. Уточните поиск.</div>` : '');
  }
  $('#count').textContent = `Показано: ${arr.length} из ${allPlaces().length}`;
  $('#grabText').textContent = `Список · ${arr.length}`;
  $('#updatedAt').textContent = placesData?.fetchedAt ? 'Данные от ' + fmtDate(placesData.fetchedAt) : '';

  // маркеры
  cluster.clearLayers(); markers.clear();
  const layers = arr.map(p => {
    const m = L.marker([p.lat,p.lon], {icon:pinIcon(p.id), title:p.name});
    m.on('click', () => select(p.id, false));
    markers.set(p.id, m);
    return m;
  });
  cluster.addLayers(layers);
}

function renderAll(){ renderChips(); renderList(); if (selectedId) renderDetail(); }

function renderDetail(){
  const p = byId(selectedId); const d = $('#detail');
  if (!p){ d.classList.remove('open'); return; }
  const c = crm[p.id] || {};
  const st = getStatus(p.id);
  const q = encodeURIComponent(p.name + ' Хабаровск ' + (p.addr||''));
  const infoRows = [
    p.addr && ['📍', esc(p.addr)],
    p.phones && ['📞', p.phones.split(';').map(x=>x.trim()).filter(Boolean).map(x=>`<a href="${telHref(x)}">${esc(x)}</a>`).join('<br>')],
    p.website && ['🌐', `<a href="${esc(/^https?:/.test(p.website)?p.website:'https://'+p.website)}" target="_blank" rel="noopener">${esc(p.website.replace(/^https?:\/\//,''))}</a>`],
    p.vk && ['💬', `<a href="${esc(/^https?:/.test(p.vk)?p.vk:'https://vk.com/'+p.vk)}" target="_blank" rel="noopener">ВКонтакте</a>`],
    p.tg && ['✈️', `<a href="${esc(/^https?:/.test(p.tg)?p.tg:'https://t.me/'+p.tg.replace('@',''))}" target="_blank" rel="noopener">Telegram</a>`],
    p.insta && ['📷', `<a href="${esc(/^https?:/.test(p.insta)?p.insta:'https://instagram.com/'+p.insta.replace('@',''))}" target="_blank" rel="noopener">Instagram</a>`],
    p.email && ['✉️', `<a href="mailto:${esc(p.email)}">${esc(p.email)}</a>`],
    p.hours && ['🕒', esc(p.hours)],
    p.cuisine && ['🍽️', esc(p.cuisine.replace(/;/g,', '))]
  ].filter(Boolean);

  d.innerHTML = `
    <div class="detail-head">
      <button class="icon-btn" id="back" title="Назад">←</button>
      <div style="min-width:0;flex:1">
        <h2>${esc(p.name)}</h2>
        <div class="sub">${esc(TYPES[p.type]||p.type)}${p.brand && p.brand!==p.name ? ' · сеть «'+esc(p.brand)+'»' : ''}</div>
      </div>
      ${p.type==='custom' ? `<button class="icon-btn" id="delCustom" title="Удалить точку">🗑</button>` : ''}
    </div>
    <div class="detail-body">
      <div>
        <div class="section-title">Статус</div>
        <div class="status-grid">
          ${Object.entries(STATUSES).map(([k,s]) => `<button class="status-btn ${k===st?'on':''}" data-set="${k}" style="${k===st?'color:'+s.color:''}"><i style="background:${s.color}"></i><span style="color:var(--text)">${s.label}</span></button>`).join('')}
        </div>
      </div>
      ${infoRows.length ? `<div><div class="section-title">Контакты</div><div class="info">${infoRows.map(r=>`<div class="info-row"><span>${r[0]}</span><span>${r[1]}</span></div>`).join('')}</div></div>`
        : `<div class="info"><div class="info-row"><span>ℹ️</span><span style="color:var(--muted)">На карте нет контактов. Найдите их в 2ГИС или Яндекс Картах и впишите в заметку.</span></div></div>`}
      <div class="actions">
        ${p.phone ? `<a class="btn primary" href="${telHref(p.phone)}">📞 Позвонить</a>` : ''}
        <a class="btn" href="https://2gis.ru/khabarovsk/search/${q}" target="_blank" rel="noopener">2ГИС</a>
        <a class="btn" href="https://yandex.ru/maps/76/khabarovsk/search/${q}" target="_blank" rel="noopener">Яндекс Карты</a>
        <a class="btn" href="https://yandex.ru/maps/?rtext=~${p.lat},${p.lon}&rtt=auto" target="_blank" rel="noopener">🚗 Маршрут</a>
      </div>
      <div class="field">
        <div class="section-title" style="margin:0">Контактное лицо</div>
        <input id="fPerson" placeholder="Например: Анна, управляющая" value="${esc(c.person||'')}">
      </div>
      <div class="two">
        <div class="field">
          <div class="section-title" style="margin:0">Свой телефон</div>
          <input id="fPhone" placeholder="+7…" value="${esc(c.phone||'')}">
        </div>
        <div class="field">
          <div class="section-title" style="margin:0">Напомнить</div>
          <input id="fNext" type="date" value="${c.nextDate ? new Date(c.nextDate).toISOString().slice(0,10) : ''}">
        </div>
      </div>
      <div class="field">
        <div class="section-title" style="margin:0">Заметка</div>
        <textarea id="fNote" placeholder="О чём договорились, что предложить, когда перезвонить…">${esc(c.note||'')}</textarea>
      </div>
      ${(c.history||[]).length ? `<div><div class="section-title">История</div><div class="history">${c.history.slice().reverse().slice(0,15).map(h=>`<div><span>${fmtDT(h.t)}</span><b>${esc(STATUSES[h.s]?.label||h.s)}</b></div>`).join('')}</div></div>` : ''}
    </div>`;
  d.classList.add('open');
}

function updateCrm(id, patch){
  const prev = crm[id] || {status:'new', history:[]};
  const next = Object.assign({}, prev, patch, {updated: Date.now()});
  if (patch.status && patch.status !== prev.status){
    next.history = [...(prev.history||[]), {t:Date.now(), s:patch.status}];
  }
  crm[id] = next; saveCrm();
}

function select(id, fly=true){
  const prevId = selectedId; selectedId = id;
  [prevId, id].forEach(x => { const m = markers.get(x); if (m) m.setIcon(pinIcon(x)); });
  const p = byId(id); if (!p) return;
  if (fly){
    const m = markers.get(id);
    if (m) cluster.zoomToShowLayer(m, () => map.panTo([p.lat,p.lon]));
    else map.setView([p.lat,p.lon], Math.max(map.getZoom(),16));
  }
  $('#aside').classList.add('expanded');
  renderDetail();
  document.querySelectorAll('.item.active').forEach(e=>e.classList.remove('active'));
  document.querySelector(`.item[data-id="${id}"]`)?.classList.add('active');
}

function closeDetail(){
  const prevId = selectedId; selectedId = null;
  $('#detail').classList.remove('open');
  const m = markers.get(prevId); if (m) m.setIcon(pinIcon(prevId));
  renderList();
}

// ---------- События ----------
$('#list').addEventListener('click', e => { const it = e.target.closest('.item'); if (it) select(it.dataset.id); });
$('#statusChips').addEventListener('click', e => {
  const b = e.target.closest('[data-status]'); if (!b) return;
  const k = b.dataset.status; ui.statuses = ui.statuses.includes(k) ? ui.statuses.filter(x=>x!==k) : [...ui.statuses, k];
  saveUi(); renderAll();
});
$('#typeChips').addEventListener('click', e => {
  const b = e.target.closest('[data-type]'); if (!b) return;
  const k = b.dataset.type; ui.types = ui.types.includes(k) ? ui.types.filter(x=>x!==k) : [...ui.types, k];
  saveUi(); renderAll();
});
let qT; $('#q').value = ui.q;
$('#q').addEventListener('input', e => { clearTimeout(qT); qT = setTimeout(()=>{ ui.q = e.target.value; saveUi(); renderList(); }, 150); });
$('#onlyPhone').checked = ui.onlyPhone;
$('#onlyPhone').addEventListener('change', e => { ui.onlyPhone = e.target.checked; saveUi(); renderList(); });
$('#sort').value = ui.sort;
$('#sort').addEventListener('change', e => { ui.sort = e.target.value; saveUi(); renderList(); });
map.on('moveend', () => { if (ui.sort === 'distance' && !selectedId) renderList(); });

$('#detail').addEventListener('click', e => {
  if (e.target.closest('#back')) return closeDetail();
  if (e.target.closest('#delCustom')){
    if (!confirm('Удалить эту точку?')) return;
    custom = custom.filter(p => p.id !== selectedId); delete crm[selectedId]; saveCrm(); closeDetail(); renderAll(); return;
  }
  const b = e.target.closest('[data-set]');
  if (b){
    updateCrm(selectedId, {status:b.dataset.set});
    renderChips(); renderList(); renderDetail();
    toast('Статус: ' + STATUSES[b.dataset.set].label);
  }
});
$('#detail').addEventListener('input', e => {
  if (!selectedId) return;
  const map_ = {fNote:'note', fPerson:'person', fPhone:'phone'};
  if (map_[e.target.id]) updateCrm(selectedId, {[map_[e.target.id]]: e.target.value});
  if (e.target.id === 'fNext') updateCrm(selectedId, {nextDate: e.target.value ? new Date(e.target.value).getTime() : null});
});
$('#detail').addEventListener('change', () => renderList());
// чтобы renderList не терял выделение в деталях
$('#grab').addEventListener('click', () => $('#aside').classList.toggle('expanded'));

// меню
$('#menuBtn').addEventListener('click', e => { e.stopPropagation(); $('#menu').classList.toggle('show'); });
document.addEventListener('click', e => { if (!e.target.closest('#menu')) $('#menu').classList.remove('show'); });
$('#menu').addEventListener('click', async e => {
  const act = e.target.closest('[data-act]')?.dataset.act; if (!act) return;
  $('#menu').classList.remove('show');
  if (act === 'reload'){ await loadPlaces(true); renderAll(); }
  if (act === 'csv') exportCsv();
  if (act === 'backup') download(`kafe-radar-backup-${new Date().toISOString().slice(0,10)}.json`, JSON.stringify({version:1, crm, ui}, null, 2), 'application/json');
  if (act === 'restore') $('#fileIn').click();
  if (act === 'theme'){
    const next = isDark() ? 'light' : 'dark';
    document.documentElement.dataset.theme = next; store.set(LS.theme, next); setTiles();
  }
});
$('#fileIn').addEventListener('change', async e => {
  const f = e.target.files[0]; if (!f) return;
  try{
    const j = JSON.parse(await f.text());
    if (!j.crm) throw 0;
    if (!confirm('Заменить текущие заметки и статусы данными из файла?')) return;
    crm = j.crm; custom = crm.__custom || []; saveCrm(); renderAll(); toast('Резервная копия загружена');
  }catch(_){ toast('Это не похоже на файл резервной копии'); }
  e.target.value = '';
});

function download(name, text, type){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type})); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
}
function exportCsv(){
  const rows = [['Название','Тип','Статус','Адрес','Телефон','Мой телефон','Контактное лицо','Сайт','Часы работы','Заметка','Напомнить','Обновлено','Широта','Долгота']];
  filtered().forEach(p => { const c = crm[p.id]||{};
    rows.push([p.name, TYPES[p.type]||p.type, STATUSES[getStatus(p.id)].label, p.addr, p.phones, c.phone||'', c.person||'', p.website, p.hours, c.note||'',
      c.nextDate?fmtDate(c.nextDate):'', c.updated?fmtDT(c.updated):'', p.lat, p.lon]); });
  const csv = '﻿' + rows.map(r => r.map(v => `"${String(v??'').replace(/"/g,'""')}"`).join(';')).join('\r\n');
  download(`kafe-habarovsk-${new Date().toISOString().slice(0,10)}.csv`, csv, 'text/csv;charset=utf-8');
  toast(`Выгружено строк: ${rows.length-1}`);
}

// добавление своей точки
let adding = false;
function setAdding(v){ adding = v; $('#addHint').classList.toggle('show', v); map.getContainer().style.cursor = v ? 'crosshair' : ''; if (v) $('#aside').classList.remove('expanded'); }
$('#addBtn').addEventListener('click', () => setAdding(!adding));
document.addEventListener('keydown', e => { if (e.key === 'Escape'){ if (adding) setAdding(false); else if (selectedId) closeDetail(); } });
map.on('click', e => {
  if (!adding) return;
  setAdding(false);
  const name = prompt('Название места:'); if (!name) return;
  const p = {id:'c'+Date.now(), name:name.trim(), type:'custom', lat:e.latlng.lat, lon:e.latlng.lng, addr:'', phone:'', phones:'', website:'', hours:''};
  custom.push(p); saveCrm();
  if (!ui.types.includes('custom')){ ui.types.push('custom'); saveUi(); }
  renderAll(); select(p.id);
});

// ---------- Старт ----------
(async () => {
  renderAll();
  await loadPlaces(false);
  renderAll();
  // мягкое обновление, если данным больше 30 дней
  if (placesData?.fetchedAt && Date.now() - placesData.fetchedAt > 30*864e5){
    try{ const fresh = await fetchPlaces(); placesData = fresh; store.set(LS.places, fresh); renderAll(); }catch(_){}
  }
})();
})();
</script>
</body>
