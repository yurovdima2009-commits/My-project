<!doctype html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Орбита</title>
<meta name="theme-color" content="#06061a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --fh:'Unbounded',system-ui,sans-serif; --fb:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --bg:#06061a;
  --bg-grad:radial-gradient(1100px 600px at 90% -10%,rgba(139,92,246,.32),transparent 60%),radial-gradient(800px 500px at -15% 35%,rgba(236,72,153,.16),transparent 60%),radial-gradient(900px 600px at 50% 120%,rgba(34,211,238,.10),transparent 60%);
  --glass:rgba(255,255,255,.045); --glass-2:rgba(255,255,255,.09); --solid:#11113a; --dock:rgba(16,16,52,.72);
  --line:rgba(255,255,255,.1); --text:#f2f1ff; --muted:#9e9dc8; --input:rgba(255,255,255,.06);
  --a1:#8b5cf6; --a2:#ec4899; --a3:#f59e0b; --a4:#22d3ee; --ok:#34d399; --danger:#fb7185;
  --grad:linear-gradient(120deg,#8b5cf6,#ec4899 55%,#f59e0b);
  --shadow:0 18px 50px -20px rgba(0,0,0,.7);
}
:root[data-theme="light"]{
  --bg:#fbf5ee;
  --bg-grad:radial-gradient(1100px 600px at 95% -15%,rgba(245,158,11,.28),transparent 60%),radial-gradient(800px 500px at -15% 30%,rgba(236,72,153,.14),transparent 60%),radial-gradient(900px 600px at 50% 120%,rgba(139,92,246,.16),transparent 60%);
  --glass:rgba(255,255,255,.62); --glass-2:#fff; --solid:#fffaf4; --dock:rgba(255,250,244,.82);
  --line:rgba(70,40,110,.12); --text:#20163a; --muted:#7b7095; --input:rgba(70,40,110,.05);
  --a1:#7c3aed; --a2:#db2777; --a3:#d97706; --a4:#0891b2; --ok:#059669; --danger:#e11d48;
  --grad:linear-gradient(120deg,#7c3aed,#db2777 55%,#f59e0b);
  --shadow:0 18px 40px -22px rgba(90,40,120,.35);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg-grad),var(--bg);background-attachment:fixed;color:var(--text);font:16px/1.45 var(--fb);-webkit-tap-highlight-color:transparent;overflow-x:hidden}
#bgsky{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
.app{max-width:680px;margin:0 auto;padding:max(16px,env(safe-area-inset-top)) 16px calc(120px + env(safe-area-inset-bottom))}
.hidden{display:none!important}
.row{display:flex;gap:8px;align-items:center}
.grow{flex:1;min-width:0}
.sub{color:var(--muted);font-size:13px}

/* шапка */
header.top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin:6px 0 14px}
.hello{color:var(--muted);font-size:13px;font-weight:600;letter-spacing:.02em}
h1{font-family:var(--fh);font-weight:800;font-size:26px;line-height:1.1;margin:4px 0 0;letter-spacing:-.02em}
.streak{font-family:var(--fh);font-size:13px;font-weight:700;padding:9px 12px;border-radius:14px;background:var(--glass);border:1px solid var(--line);white-space:nowrap}
.ib{flex:none;width:42px;height:42px;border-radius:14px;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);display:grid;place-items:center;color:var(--text);padding:0}
.ib svg{width:20px;height:20px}
.ib:active{transform:scale(.94)}

/* карточки */
.card{background:var(--glass);border:1px solid var(--line);border-radius:24px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.ch{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px;font-family:var(--fh);font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.ch b{color:var(--text);font-weight:700}
input[type=text],input[type=date],textarea,select{width:100%;background:var(--input);border:1px solid var(--line);border-radius:14px;padding:12px 14px;outline:none;transition:border-color .2s,box-shadow .2s}
input:focus,textarea:focus,select:focus{border-color:var(--a1);box-shadow:0 0 0 4px color-mix(in srgb,var(--a1) 22%,transparent)}
::placeholder{color:var(--muted);opacity:.8}
textarea{resize:vertical;min-height:90px}
select option{background:var(--solid)}
.btn{border:0;background:var(--grad);color:#fff;border-radius:14px;padding:12px 18px;font-weight:800;white-space:nowrap;box-shadow:0 8px 24px -10px var(--a2);transition:transform .15s}
.btn:active{transform:scale(.96)}
.btn.sq{width:46px;height:46px;padding:0;font-size:22px;flex:none}
.btn.soft{background:var(--glass-2);color:var(--text);box-shadow:none;border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--danger);box-shadow:none;border:1px solid var(--line)}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:11px}
.addrow{display:flex;gap:8px;margin-top:10px}
.hint{font-size:12px;color:var(--muted);margin-top:8px}
.empty{color:var(--muted);font-size:14px;padding:10px 2px}

/* списки */
ul.list{list-style:none;margin:0;padding:0}
.it{display:flex;align-items:flex-start;gap:12px;padding:12px 2px;border-bottom:1px dashed var(--line);position:relative}
.it:last-child{border-bottom:0}
.it .txt{flex:1;min-width:0;overflow-wrap:anywhere;cursor:pointer;padding-top:1px}
.it.done .txt{color:var(--muted);text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--muted) 60%,transparent)}
.it.p1::before,.it.p2::before{content:"";position:absolute;left:-12px;top:16px;width:4px;height:16px;border-radius:0 4px 4px 0;background:var(--a3)}
.it.p2::before{background:var(--danger);box-shadow:0 0 12px var(--danger)}
.it.done::before{opacity:.25}
.chk{appearance:none;-webkit-appearance:none;flex:none;width:24px;height:24px;margin:0;border:2px solid color-mix(in srgb,var(--muted) 70%,transparent);border-radius:50%;display:grid;place-items:center;cursor:pointer;background:transparent;transition:transform .15s}
.chk:active{transform:scale(.85)}
.chk:checked{border-color:transparent;background:var(--grad);box-shadow:0 0 14px -2px var(--a2)}
.chk:checked::after{content:"";width:5px;height:10px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.meta{font-size:12px;color:var(--muted);display:flex;gap:6px 10px;flex-wrap:wrap;margin-top:3px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--glass-2);border:1px solid var(--line);color:var(--text)}
.chip.p1{color:var(--a3);border-color:color-mix(in srgb,var(--a3) 40%,transparent)}
.chip.p2{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 45%,transparent)}
.chip.late{color:var(--danger)}
.chip.acc{color:var(--a1)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;min-height:0}
.mini{flex:none;border:0;background:transparent;color:var(--muted);width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-size:13px;opacity:.75}
.mini:hover{opacity:1;background:var(--glass-2)}
.mini.del{font-size:20px;line-height:1}
.mini.del:hover{color:var(--danger)}
.mini.play{color:var(--a4);font-size:11px}
.planet{flex:none;width:24px;height:24px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#fff8,transparent 45%),var(--c);box-shadow:0 0 14px -2px var(--c);font-family:var(--fh);font-size:11px;font-weight:800;color:#fff;display:grid;place-items:center}
.goal.done .planet{filter:saturate(1.2)}
.goal:not(.done) .planet{background:transparent;border:2px solid var(--c);box-shadow:none;color:var(--c)}
.group-title{font-family:var(--fh);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:16px 0 0}
.group-title:first-child{margin-top:2px}
.group-title.late{color:var(--danger)}

/* орбита */
.hero{position:relative;margin:-4px 0 6px;text-align:center}
.orbit{width:100%;max-width:330px;margin:0 auto;display:block;aspect-ratio:1}
.orbit svg{width:100%;height:100%;overflow:visible}
.planets{transform-origin:150px 150px;animation:spin 90s linear infinite}
.sun{animation:pulse 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{50%{transform:scale(1.25);opacity:.85}}
.hero .nav{position:absolute;top:50%;transform:translateY(-70%)}
.hero .nav.l{left:-4px}.hero .nav.r{right:-4px}
.dayline{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:2px}
.dayline b{font-family:var(--fh);font-size:15px}
.today-link{border:0;background:none;color:var(--a1);font-weight:700;font-size:13px;padding:0}
.fly{border:1px solid var(--line);background:var(--glass);border-radius:99px;padding:6px 12px;font-size:13px;font-weight:700;color:var(--text)}

/* настроение */
.moods{display:flex;gap:6px}
.moods button{flex:1;border:1px solid var(--line);background:var(--input);border-radius:14px;padding:8px 0 6px;display:flex;flex-direction:column;align-items:center;gap:2px;transition:all .2s}
.moods button span{font-size:22px;line-height:1;filter:grayscale(.7);opacity:.6;transition:all .2s}
.moods button small{font-size:10px;color:var(--muted);font-weight:700}
.moods button.on{border-color:var(--a1);background:color-mix(in srgb,var(--a1) 18%,transparent)}
.moods button.on span{filter:none;opacity:1;transform:scale(1.15)}
.question{font-family:var(--fh);font-size:14px;font-weight:500;margin:14px 0 8px;line-height:1.35}
.question::before{content:"✦ ";color:var(--a3)}

/* сегменты */
.segs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;scrollbar-width:none;padding:2px}
.segs::-webkit-scrollbar{display:none}
.segs button{border:1px solid var(--line);background:var(--glass);border-radius:99px;padding:7px 14px;font-size:13px;font-weight:700;white-space:nowrap;color:var(--muted)}
.segs button.on{background:var(--text);border-color:var(--text);color:var(--bg)}

/* заметки */
.search{display:flex;gap:8px;margin-bottom:14px}
.notes-grid{columns:2 170px;column-gap:12px}
.note{break-inside:avoid;margin-bottom:12px;border-radius:20px;padding:14px;border:1px solid var(--line);cursor:pointer;
  background:linear-gradient(160deg,hsla(var(--h),85%,60%,.22),transparent 65%),var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);transition:transform .2s}
.note:hover{transform:translateY(-2px)}
.note h3{margin:0 0 6px;font-family:var(--fh);font-size:14px;font-weight:700;line-height:1.3}
.note p{margin:0;color:var(--muted);font-size:14px;white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:8;-webkit-box-orient:vertical;overflow:hidden}
.note .meta{margin-top:10px}
.caps{display:flex;gap:10px;overflow-x:auto;margin:0 -16px 14px;padding:2px 16px;scrollbar-width:none}
.caps::-webkit-scrollbar{display:none}
.cap{flex:none;width:170px;border-radius:20px;padding:14px;border:1px dashed color-mix(in srgb,var(--a4) 50%,transparent);background:color-mix(in srgb,var(--a4) 8%,var(--glass));cursor:pointer}
.cap .ic{font-size:24px}
.cap b{display:block;font-family:var(--fh);font-size:13px;margin:6px 0 2px}
.cap.ready{border-style:solid;border-color:var(--a3);background:color-mix(in srgb,var(--a3) 16%,var(--glass));box-shadow:0 0 24px -8px var(--a3);animation:glow 2s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 34px -4px var(--a3)}}
.banner{display:flex;gap:12px;align-items:center;cursor:pointer;border-color:color-mix(in srgb,var(--a3) 60%,transparent)}
.banner .ic{font-size:30px}

/* миссии */
.mission .horizon{font-family:var(--fh);font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--a1)}
.mission h3{margin:4px 0 2px;font-family:var(--fh);font-size:17px;font-weight:700;line-height:1.25}
.track{position:relative;height:34px;margin:16px 6px 6px}
.track .line{position:absolute;left:0;right:0;top:15px;height:4px;border-radius:4px;background:var(--line)}
.track .line i{display:block;height:100%;border-radius:4px;background:var(--grad);transition:width .5s}
.track .node{position:absolute;top:11px;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:var(--solid);border:2px solid var(--line)}
.track .node.on{background:var(--a2);border-color:var(--a2);box-shadow:0 0 10px var(--a2)}
.track .rocket{position:absolute;top:0;margin-left:-14px;font-size:22px;transform:rotate(45deg);transition:left .5s;filter:drop-shadow(0 0 8px var(--a3))}
.track .flag{position:absolute;right:-8px;top:2px;font-size:16px}
.step{display:flex;gap:12px;align-items:center;padding:7px 0}
.step .txt{flex:1;overflow-wrap:anywhere}
.step.done .txt{color:var(--muted);text-decoration:line-through}
.mission.won{border-color:color-mix(in srgb,var(--a3) 50%,transparent)}

/* док */
.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom));width:min(440px,calc(100% - 24px));display:grid;grid-template-columns:repeat(5,1fr);align-items:center;
  background:var(--dock);backdrop-filter:blur(22px) saturate(1.4);-webkit-backdrop-filter:blur(22px) saturate(1.4);border:1px solid var(--line);border-radius:26px;padding:6px;z-index:15;box-shadow:0 20px 50px -15px rgba(0,0,0,.55)}
.dock button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:10px;font-weight:700;padding:7px 0;border-radius:18px;transition:color .2s}
.dock button svg{width:22px;height:22px}
.dock button.on{color:var(--text)}
.dock button.on svg{filter:drop-shadow(0 0 8px var(--a1));color:var(--a1)}
.dock .plus{justify-self:center;width:58px;height:58px;margin-top:-26px;border-radius:50%;background:var(--grad);color:#fff;box-shadow:0 10px 30px -6px var(--a2),0 0 0 6px var(--bg);padding:0;justify-content:center}
.dock .plus svg{width:26px;height:26px}
.fpill{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom));z-index:14;border:1px solid var(--line);background:var(--dock);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-radius:99px;padding:8px 16px;font-family:var(--fh);font-size:13px;font-weight:700;color:var(--text)}

/* модалка */
.modal-bg{position:fixed;inset:0;background:rgba(3,3,15,.55);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:none;align-items:flex-end;justify-content:center;z-index:30}
.modal-bg.open{display:flex}
.modal{background:var(--solid);width:100%;max-width:680px;max-height:92vh;overflow:auto;border-radius:28px 28px 0 0;border:1px solid var(--line);border-bottom:0;padding:10px 18px calc(18px + env(safe-area-inset-bottom));animation:up .28s cubic-bezier(.2,.9,.3,1)}
.modal::before{content:"";display:block;width:40px;height:5px;border-radius:5px;background:var(--line);margin:0 auto 14px}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@media (min-width:760px){.modal-bg{align-items:center}.modal{border-radius:28px;border-bottom:1px solid var(--line)}}
.modal h3{margin:0 0 14px;font-family:var(--fh);font-size:19px}
.field{margin-bottom:12px}
.field>label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.06em}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.themes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.themes button{border:2px solid var(--line);border-radius:16px;padding:12px 6px;background:var(--input);font-weight:700;font-size:13px}
.themes button i{display:block;height:34px;border-radius:10px;margin-bottom:6px}
.themes button.on{border-color:var(--a1)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{border-radius:16px;padding:10px 4px;text-align:center;background:var(--input);border:1px solid var(--line)}
.stat b{display:block;font-family:var(--fh);font-size:18px}
.stat span{font-size:10px;color:var(--muted);font-weight:700}
.capsule-open{font-size:17px;line-height:1.55;white-space:pre-wrap;padding:16px;border-radius:18px;background:color-mix(in srgb,var(--a3) 10%,var(--input));border:1px solid color-mix(in srgb,var(--a3) 40%,transparent)}

/* оверлеи: небо и фокус */
.overlay{position:fixed;inset:0;z-index:40;display:none;background:#04041a;color:#f2f1ff}
.overlay.open{display:block;animation:fade .35s}
@keyframes fade{from{opacity:0}}
#skyCanvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.sky-ui{position:absolute;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;padding:max(18px,env(safe-area-inset-top)) 18px calc(22px + env(safe-area-inset-bottom))}
.sky-ui>*{pointer-events:auto}
.sky-top{display:flex;justify-content:space-between;align-items:flex-start}
.sky-top h2,.focus-in h2{font-family:var(--fh);margin:0;font-size:24px}
.overlay .sub{color:#a9a8d6}
.overlay .ib{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.14);color:#fff}
.sky-tip{align-self:center;max-width:460px;text-align:center;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:18px;padding:12px 16px;font-size:14px}
.sky-tip b{font-family:var(--fh);display:block;font-size:14px;margin-bottom:2px}
#focus{background:radial-gradient(600px 500px at 50% 40%,rgba(139,92,246,.35),transparent 70%),radial-gradient(500px 400px at 50% 100%,rgba(236,72,153,.25),transparent 70%),#04041a}
.focus-in{max-width:440px;margin:0 auto;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px 20px;text-align:center;position:relative}
.focus-in .ib.x{position:absolute;top:max(18px,env(safe-area-inset-top));right:18px}
.focus-in h2{font-size:20px;line-height:1.3;overflow-wrap:anywhere}
.fring{position:relative;width:min(300px,76vw);aspect-ratio:1}
.fring svg{width:100%;height:100%}
.ftime{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--fh);font-size:clamp(40px,13vw,58px);font-weight:700;letter-spacing:-.02em}
.focus-in .segs button{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.14);color:#c9c8ef}
.focus-in .segs button.on{background:#fff;color:#04041a}
.focus-in .btn.soft{background:rgba(255,255,255,.08);color:#fff;border-color:rgba(255,255,255,.14)}
.focus-in .done-msg{font-family:var(--fh);font-size:16px}

.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translate(-50%,10px);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:99px;font-size:14px;font-weight:700;opacity:0;transition:all .25s;pointer-events:none;z-index:60;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}
.spark{position:fixed;width:7px;height:7px;border-radius:50%;pointer-events:none;z-index:70}
.view-in{animation:vin .35s cubic-bezier(.2,.9,.3,1)}
@keyframes vin{from{opacity:0;transform:translateY(8px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="bgsky" aria-hidden="true"></canvas>
<div class="app">
  <header class="top">
    <div class="grow">
      <div class="hello" id="hello"></div>
      <h1 id="title"></h1>
    </div>
    <div class="row">
      <span class="streak hidden" id="streak" title="Дней подряд с выполненными делами"></span>
      <button class="ib" id="skyBtn" title="Моё небо" aria-label="Моё небо"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.2 6.6L21 10l-5.5 4 1.9 7L12 17.3 6.6 21l1.9-7L3 10l6.8-1.4z"/></svg></button>

<script>
(() => {
'use strict';
// ================= утилиты =================
const KEY = 'myday-data-v1';
const $ = s => document.querySelector(s);

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const fromIso = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const todayIso = () => iso(new Date());
const addDays = (s, n) => { const d = fromIso(s); d.setDate(d.getDate()+n); return iso(d); };
const diffDays = (a, b) => Math.round((fromIso(b) - fromIso(a)) / 864e5);
const fmt = (s, o={day:'numeric', month:'long'}) => fromIso(s).toLocaleDateString('ru-RU', o);
const cap1 = s => s[0].toUpperCase() + s.slice(1);
function relDay(s){
  const t = todayIso();
  if (s === t) return 'Сегодня';
  if (s === addDays(t,1)) return 'Завтра';
  if (s === addDays(t,-1)) return 'Вчера';
  if (s === addDays(t,2)) return 'Послезавтра';
  return cap1(fromIso(s).toLocaleDateString('ru-RU',{weekday:'long'}));
}
function plural(n, a, b, c){ const m10 = n%10, m100 = n%100; return m10===1&&m100!==11 ? a : (m10>=2&&m10<=4&&(m100<12||m100>14)) ? b : c; }
function hash(s){ let h = 2166136261; for (let i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h>>>0; }
function rng(seed){ let a = seed>>>0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a>>>15, 1 | a); t = t + Math.imul(t ^ t>>>7, 61 | t) ^ t; return ((t ^ t>>>14)>>>0) / 4294967296; }; }
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

// ================= данные =================
const LISTS = ['tasks','goals','notes','plans','capsules','focus'];
const empty = () => ({ v:2, tasks:[], goals:[], notes:[], plans:[], capsules:[], focus:[], days:{}, settings:{theme:'dark'} });
function normalize(d){
  d = Object.assign(empty(), d || {});
  for (const k of LISTS) if (!Array.isArray(d[k])) d[k] = [];
  if (!d.days || typeof d.days !== 'object') d.days = {};

  for (const p of d.plans) if (!Array.isArray(p.steps)) p.steps = [];

}
let db;
try { db = normalize(JSON.parse(localStorage.getItem(KEY))); } catch { db = empty(); }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(db)); } catch { toast('Не удалось сохранить'); } }
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{});

// ================= константы =================
const PRIO = ['', 'Важно', 'Срочно'];
const HORIZONS = {week:'Неделя', month:'Месяц', year:'Год', life:'Мечта'};
const MOODS = [['🌑','пусто'],['🌒','так себе'],['🌓','ровно'],['🌔','хорошо'],['🌕','сияю']];
const PC = ['var(--a4)','var(--a2)','var(--a3)'];
const QUESTIONS = ['Что сегодня принесло радость?','Чему я научился сегодня?','За что я благодарен сегодня?','Что можно было сделать лучше?','Какой момент дня хочется запомнить?','Что меня вдохновило?','Кому я сегодня помог — или кто помог мне?','Что меня удивило?','Что я сделал для своего здоровья?','Какой маленький шаг к большой цели я сделал?','Что я откладываю и почему?','Что бы я сказал себе утром этого дня?','С кем было приятно пообщаться?','Что дало энергию, а что её забрало?','Чем я горжусь сегодня?','Что я сделаю завтра иначе?'];

// ================= общее =================

  const cols = ['#8b5cf6','#ec4899','#f59e0b','#22d3ee','#fff'];
  for (let i=0;i<16;i++){
    const s = document.createElement('i'); s.className = 'spark';
    s.style.left = x+'px'; s.style.top = y+'px'; s.style.background = cols[i%cols.length];
    document.body.append(s);
    const a = Math.random()*Math.PI*2, d = 28 + Math.random()*46;
    s.animate([{transform:'translate(-50%,-50%) scale(1)',opacity:1},{transform:`translate(calc(-50% + ${Math.cos(a)*d}px),calc(-50% + ${Math.sin(a)*d}px)) scale(0)`,opacity:0}],
      {duration:550+Math.random()*350, easing:'cubic-bezier(.2,.8,.3,1)'}).onfinish = () => s.remove();
  }

}

// тема
const mqLight = matchMedia('(prefers-color-scheme: light)');
function applyTheme(){
  const t = db.settings.theme === 'auto' ? (mqLight.matches ? 'light' : 'dark') : (db.settings.theme === 'light' ? 'light' : 'dark');
  document.documentElement.dataset.theme = t;
  $('meta[name=theme-color]').content = t === 'light' ? '#fbf5ee' : '#06061a';
  drawBgSky();
}
mqLight.addEventListener && mqLight.addEventListener('change', applyTheme);
function drawBgSky(){
  const c = $('#bgsky');
  if (document.documentElement.dataset.theme !== 'dark'){ c.style.display = 'none'; return; }
  c.style.display = 'block';
  const dpr = Math.min(devicePixelRatio || 1, 2), w = innerWidth, h = innerHeight;
  c.width = w*dpr; c.height = h*dpr;
  const x = c.getContext('2d'); x.setTransform(dpr,0,0,dpr,0,0); x.clearRect(0,0,w,h);
  const r = rng(7), n = Math.round(w*h/5000);
  for (let i=0;i<n;i++){
    x.globalAlpha = .15 + r()*.6; x.fillStyle = r() < .1 ? '#fbbf24' : r() < .2 ? '#a5b4fc' : '#fff';
    x.beginPath(); x.arc(r()*w, r()*h, Math.pow(r(),3)*1.3+.25, 0, 7); x.fill();
  }
}
let rz; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { drawBgSky(); if ($('#sky').classList.contains('open')) layoutSky(); }, 150); });

// ================= разбор естественного языка =================
const WD = [[/^(воскресенье|вс)$/,0],[/^(понедельник|пн)$/,1],[/^(вторник|вт)$/,2],[/^(сред[ау]|ср)$/,3],[/^(четверг|чт)$/,4],[/^(пятниц[ау]|пт)$/,5],[/^(суббот[ау]|сб)$/,6]];
function parseText(text){
  let s = ' ' + text + ' ', date = null, prio = 0; const tags = [];
  const t0 = todayIso();
  const take = (re, fn) => { s = s.replace(re, (...m) => { const r = fn(m); return r === false ? m[0] : ' '; }); };
  take(/\s!(!?)!?(?=\s)/, m => { prio = m[1] ? 2 : 1; });
  take(/\s#([\p{L}\d_-]+)(?=\s)/gu, m => { tags.push(m[1].toLowerCase()); });
  if (!date) take(/\sпослезавтра(?=\s)/i, () => { date = addDays(t0,2); });
  if (!date) take(/\sзавтра(?=\s)/i, () => { date = addDays(t0,1); });
  if (!date) take(/\sсегодня(?=\s)/i, () => { date = t0; });
  if (!date) take(/\sчерез\s+неделю(?=\s)/i, () => { date = addDays(t0,7); });
  if (!date) take(/\sчерез\s+(\d{1,3})\s+(?:день|дня|дней)(?=\s)/i, m => { date = addDays(t0, +m[1]); });
  if (!date) take(/\s(\d{1,2})\.(\d{1,2})(?:\.(\d{2,4}))?(?=\s)/, m => {
    const d = +m[1], mo = +m[2]; if (d<1||d>31||mo<1||mo>12) return false;
    let y = m[3] ? +m[3] : new Date().getFullYear(); if (y < 100) y += 2000;
    let c = iso(new Date(y, mo-1, d)); if (!m[3] && c < t0) c = iso(new Date(y+1, mo-1, d));
    date = c;
  });
  if (!date) take(/\s(?:во?\s+)?([а-яё]+)(?=\s)/gi, m => {
    if (date) return false;
    const w = m[1].toLowerCase(), hit = WD.find(([re]) => re.test(w)); if (!hit) return false;
    const cur = new Date().getDay(); date = addDays(t0, ((hit[1] - cur + 7) % 7) || 7);
  });
  return { title: s.replace(/\s+/g,' ').trim(), date, prio, tags };
}
function previewChips(p, opt={}){
  const c = [];
  if (p.date) c.push(`<span class="chip acc">📅 ${esc(relDay(p.date))}, ${esc(fmt(p.date))}</span>`);
  else if (opt.inbox) c.push(`<span class="chip">📥 без даты</span>`);
  if (p.prio) c.push(`<span class="chip p${p.prio}">${p.prio===2?'🔥':'⚡'} ${PRIO[p.prio]}</span>`);
  if (opt.tags) p.tags.forEach(t => c.push(`<span class="chip">#${esc(t)}</span>`));
  return c.join('');
}

// ================= навигация =================
function setView(v){
  view = v;
  for (const k of Object.keys(TITLES)){ const el = $('#v-'+k); el.classList.toggle('hidden', k !== v); if (k === v){ el.classList.remove('view-in'); void el.offsetWidth; el.classList.add('view-in'); } }
  $$('.dock [data-view]').forEach(b => b.classList.toggle('on', b.dataset.view === v));

}
function render(){
  renderHeader();
  if (view === 'day') renderDay();
  if (view === 'tasks') renderTasks();
  if (view === 'notes') renderNotes();
  if (view === 'missions') renderMissions();
}
function renderHeader(){
  const h = new Date().getHours();
  const hi = h < 5 ? 'Доброй ночи' : h < 12 ? 'Доброе утро' : h < 18 ? 'Добрый день' : 'Добрый вечер';
  const dateStr = cap1(new Date().toLocaleDateString('ru-RU',{weekday:'long', day:'numeric', month:'long'}));
  $('#hello').textContent = view === 'day' ? hi + ' ✦' : dateStr;
  $('#title').textContent = view === 'day' ? dateStr : TITLES[view];
  const st = streak();
  $('#streak').classList.toggle('hidden', !st);
  $('#streak').textContent = `🔥 ${st}`;
  $('#streak').title = `${st} ${plural(st,'день','дня','дней')} подряд с выполненными делами`;
}
function activeDays(){
  const s = new Set();
  for (const t of db.tasks) if (t.done) s.add(t.doneAt ? iso(new Date(t.doneAt)) : (t.date || iso(new Date(t.createdAt))));
  for (const g of db.goals) if (g.done) s.add(g.date);
  return s;
}
function streak(){
  const s = activeDays(); let d = todayIso(); if (!s.has(d)) d = addDays(d,-1);
  let n = 0; while (s.has(d)){ n++; d = addDays(d,-1); } return n;
}

// ================= задачи (строка) =================
function sortTasks(a,b){ return (a.done - b.done) || ((b.prio||0) - (a.prio||0)) || (a.createdAt - b.createdAt); }
function taskLi(t, o={}){
  const late = t.date && !t.done && t.date < todayIso();
  const meta = [];
  if (t.prio) meta.push(`<span class="chip p${t.prio}">${t.prio===2?'🔥':'⚡'} ${PRIO[t.prio]}</span>`);
  if (o.showDate && t.date) meta.push(`<span class="${late?'chip late':''}">📅 ${esc(relDay(t.date))}, ${esc(fmt(t.date))}</span>`);
  if (o.showLate && late) meta.push(`<span class="chip late">просрочено · ${esc(fmt(t.date))}</span>`);
  const fm = db.focus.filter(f => f.taskId === t.id).reduce((a,f) => a + f.min, 0);
  if (fm) meta.push(`<span>⏱ ${fm} мин</span>`);
  if (t.note) meta.push('<span>✎ описание</span>');
  return `<li class="it ${t.done?'done':''} p${t.prio||0}" data-id="${t.id}">
    <input type="checkbox" class="chk" data-act="tt" ${t.done?'checked':''} aria-label="Готово">
    <div class="txt" data-act="et">${esc(t.title)}${meta.length?`<div class="meta">${meta.join('')}</div>`:''}</div>

}

// ================= ДЕНЬ =================
function polar(r, deg){ const a = (deg-90)*Math.PI/180; return [150 + r*Math.cos(a), 150 + r*Math.sin(a)]; }
function arcPath(r, d0, d1){
  if (d1 - d0 >= 359.99) d1 = d0 + 359.99;
  const [x0,y0] = polar(r,d0), [x1,y1] = polar(r,d1);
  return `M${x0.toFixed(2)} ${y0.toFixed(2)}A${r} ${r} 0 ${d1-d0>180?1:0} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}`;
}
function dayData(){
  const goals = db.goals.filter(g => g.date === curDay);
  const tasks = db.tasks.filter(t => t.date === curDay).sort(sortTasks);
  const late = curDay === todayIso() ? db.tasks.filter(t => t.date && t.date < curDay && !t.done).sort((a,b)=>a.date.localeCompare(b.date)) : [];

}
// Safari не понимает var() в SVG-атрибутах — переносим их в style
function cssVars(svg){

function renderOrbit(d){
  const all = [...d.goals, ...d.tasks, ...d.late], done = all.filter(x => x.done).length;

  const frac = curDay === t0 ? (now.getHours()*60 + now.getMinutes())/1440 : curDay < t0 ? 1 : 0;
  const focusMin = db.focus.filter(f => f.date === curDay).reduce((a,f) => a + f.min, 0);
  let ticks = '';
  for (let i=0;i<48;i++){
    const deg = i*7.5, major = i%12 === 0, mid = i%2 === 0;
    const [x1,y1] = polar(major?127:mid?132:135, deg), [x2,y2] = polar(140, deg);
    const lit = i/48 <= frac;
    ticks += `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="${lit?'var(--a3)':'var(--muted)'}" stroke-opacity="${lit?(major?1:.7):(major?.6:.25)}" stroke-width="${major?2:1.2}" stroke-linecap="round"/>`;
  }
  const labels = [0,6,12,18].map(hh => { const [x,y] = polar(120, hh*15); return `<text x="${x}" y="${y}" font-size="8" fill="var(--muted)" text-anchor="middle" dominant-baseline="middle" font-family="var(--fh)">${pad(hh)}</text>`; }).join('');
  const [sx,sy] = polar(146, frac*360);
  const sun = curDay === t0 ? `<circle cx="${sx}" cy="${sy}" r="11" fill="var(--a3)" opacity=".25" class="sun"/><circle cx="${sx}" cy="${sy}" r="5.5" fill="var(--a3)" filter="url(#glow)"/>` : '';
  const planets = [0,1,2].map(i => {
    const g = d.goals[i], [x,y] = polar(74, i*120 + 30);
    if (!g) return `<circle cx="${x}" cy="${y}" r="3" fill="var(--muted)" opacity=".35"/>`;
    return g.done
      ? `<circle cx="${x}" cy="${y}" r="16" fill="${PC[i]}" opacity=".18"/><circle cx="${x}" cy="${y}" r="9" fill="${PC[i]}" filter="url(#glow)"/>`
      : `<circle cx="${x}" cy="${y}" r="8" fill="var(--bg)" stroke="${PC[i]}" stroke-width="2.5"/>`;
  }).join('');
  const center = all.length
    ? `<text x="150" y="146" text-anchor="middle" font-family="var(--fh)" font-weight="800" font-size="40" fill="var(--text)">${Math.round(pct*100)}<tspan font-size="18" dx="2">%</tspan></text>
       <text x="150" y="168" text-anchor="middle" font-size="11" font-weight="700" fill="var(--muted)" letter-spacing="1">${done} ИЗ ${all.length}</text>`
    : `<text x="150" y="150" text-anchor="middle" font-family="var(--fh)" font-weight="700" font-size="14" fill="var(--text)">Чистый лист</text>
       <text x="150" y="168" text-anchor="middle" font-size="11" font-weight="700" fill="var(--muted)">запусти первую планету</text>`;
  const fm = focusMin ? `<text x="150" y="188" text-anchor="middle" font-size="11" font-weight="700" fill="var(--a4)">⏱ ${focusMin} мин полёта</text>` : '';
  $('#orbit').innerHTML = cssVars(`<svg viewBox="0 0 300 300" role="img" aria-label="Прогресс дня ${Math.round(pct*100)}%">
    <defs>
      <linearGradient id="og" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--a1)"/><stop offset=".55" style="stop-color:var(--a2)"/><stop offset="1" style="stop-color:var(--a3)"/></linearGradient>
      <radialGradient id="core"><stop offset="0" style="stop-color:var(--a1);stop-opacity:.28"/><stop offset="1" style="stop-color:var(--a1);stop-opacity:0"/></radialGradient>
      <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    </defs>
    <circle cx="150" cy="150" r="100" fill="url(#core)"/>
    ${ticks}${labels}
    ${frac>0?`<path d="${arcPath(146,0,frac*360)}" fill="none" stroke="var(--a3)" stroke-opacity=".45" stroke-width="1.5" stroke-dasharray="2 4"/>`:''}
    ${sun}
    <circle cx="150" cy="150" r="105" fill="none" stroke="var(--line)" stroke-width="9"/>
    ${pct>0?`<path d="${arcPath(105,0,pct*360)}" fill="none" stroke="url(#og)" stroke-width="9" stroke-linecap="round" filter="url(#glow)"/>`:''}
    <circle cx="150" cy="150" r="74" fill="none" stroke="var(--muted)" stroke-opacity=".3" stroke-dasharray="1 5" stroke-linecap="round"/>
    <g class="planets">${planets}</g>
    ${center}${fm}
  </svg>`);
}

function renderTasks(){
  $$('#taskFilter button').forEach(b => b.classList.toggle('on', b.dataset.f === taskFilter));
  const t0 = todayIso();
  let list = db.tasks.slice();
  if (taskFilter === 'active') list = list.filter(t => !t.done);
  if (taskFilter === 'inbox') list = list.filter(t => !t.date && !t.done);
  if (taskFilter === 'done') list = list.filter(t => t.done).sort((a,b) => (b.doneAt||0) - (a.doneAt||0));
  const box = $('#tasksBox');
  if (!list.length){ box.innerHTML = `<div class="empty">${taskFilter==='done'?'Пока ничего не выполнено — первая звезда ждёт ✦':'Здесь пусто. Запиши задачу выше 👆'}</div>`; return; }
  if (taskFilter === 'done'){ box.innerHTML = `<ul class="list">${list.map(t => taskLi(t,{showDate:true})).join('')}</ul>`; return; }
  const groups = new Map();
  const key = t => !t.date ? '~' : (t.date < t0 && !t.done ? '!' : t.date);
  for (const t of list){ const k = key(t); if (!groups.has(k)) groups.set(k, []); groups.get(k).push(t); }
  const keys = [...groups.keys()].sort((a,b) => a === '!' ? -1 : b === '!' ? 1 : a.localeCompare(b));
  box.innerHTML = keys.map(k => {
    const items = groups.get(k).sort(k === '!' ? (a,b) => a.date.localeCompare(b.date) : sortTasks);
    const title = k === '!' ? '⚠ Просрочено' : k === '~' ? '📥 Без даты' : `${relDay(k)} · ${fmt(k)}`;
    return `<div class="group-title ${k==='!'?'late':''}">${esc(title)}</div><ul class="list">${items.map(t => taskLi(t,{showDate:k==='!'})).join('')}</ul>`;
  }).join('');
}

// ================= НЕБО =================
let sky = null, skyRaf = 0;
function skyItems(){
  const items = [];
  for (const t of db.tasks) if (t.done) items.push({id:t.id, title:t.title, kind:'task', prio:t.prio||0, date: t.doneAt ? iso(new Date(t.doneAt)) : (t.date || iso(new Date(t.createdAt)))});
  for (const g of db.goals) if (g.done) items.push({id:g.id, title:g.text, kind:'goal', date:g.date});
  for (const p of db.plans) if (p.archived) items.push({id:p.id, title:p.title, kind:'mission', date: iso(new Date(p.doneAt || p.createdAt))});
  return items;
}
function layoutSky(){
  const c = $('#skyCanvas'), dpr = Math.min(devicePixelRatio || 1, 2), w = innerWidth, h = innerHeight;
  c.width = w*dpr; c.height = h*dpr;
  const items = skyItems(), byDay = new Map();
  for (const it of items){ if (!byDay.has(it.date)) byDay.set(it.date, []); byDay.get(it.date).push(it); }
  const days = [...byDay.keys()].sort(), n = days.length;
  const cx = w/2, cy = h/2 + 10, maxR = Math.min(w, h) * .40;
  const stars = [], cons = [];
  days.forEach((d, k) => {
    const r = n === 1 ? 0 : maxR * Math.sqrt((k + .6) / n), ang = k * 2.39996 + 1.2;
    const dx = cx + r*Math.cos(ang), dy = cy + r*Math.sin(ang)*.82;
    const list = byDay.get(d), spread = Math.min(54, 16 + list.length*7), group = [];
    list.forEach((it, j) => {
      const rr = rng(hash(it.id)), a = rr()*Math.PI*2, dist = list.length === 1 ? 0 : (.35 + rr()*.65) * spread;
      const st = {...it, x: dx + Math.cos(a)*dist, y: dy + Math.sin(a)*dist, ph: rr()*6.28,
        r: it.kind === 'mission' ? 4.2 : it.kind === 'goal' ? 2.8 : 1.5 + it.prio*.5,
        col: it.kind === 'mission' ? '#f472b6' : it.kind === 'goal' ? '#fbbf24' : (it.prio === 2 ? '#fda4af' : it.prio === 1 ? '#fde68a' : '#e0e7ff')};
      stars.push(st); group.push(st);
    });
    // созвездие: соединяем ближайших соседей по цепочке
    if (group.length > 1){
      const left = group.slice(1), chain = [group[0]];
      while (left.length){ const last = chain[chain.length-1]; left.sort((p,q) => Math.hypot(p.x-last.x,p.y-last.y) - Math.hypot(q.x-last.x,q.y-last.y)); chain.push(left.shift()); }
      cons.push({date:d, chain});
    }
  });
  const dr = rng(99), dust = [];
  for (let i=0;i<Math.round(w*h/2600);i++) dust.push({x:dr()*w, y:dr()*h, r:Math.pow(dr(),4)*1.2+.2, a:.08+dr()*.35, ph:dr()*6.28});
  sky = {w, h, dpr, stars, cons, dust, sel: sky && sky.sel, cx, cy, maxR, days: n};
  $('#skyStats').textContent = `${stars.length} ${plural(stars.length,'звезда','звезды','звёзд')} · ${n} ${plural(n,'созвездие','созвездия','созвездий')}`;
  if (!sky.sel) $('#skyTip').innerHTML = stars.length ? 'Каждое сделанное дело зажигает звезду, а один день — это созвездие. <span class="sub">Нажми на звезду.</span>' : '<b>Небо пока пустое</b>Выполни первую задачу — и здесь зажжётся первая звезда ✦';
}
function drawSky(time){
  const c = $('#skyCanvas'), x = c.getContext('2d'), s = sky;
  x.setTransform(s.dpr,0,0,s.dpr,0,0); x.clearRect(0,0,s.w,s.h);
  const g = x.createRadialGradient(s.cx, s.cy, 0, s.cx, s.cy, s.maxR*1.5);
  g.addColorStop(0,'rgba(139,92,246,.30)'); g.addColorStop(.45,'rgba(236,72,153,.10)'); g.addColorStop(1,'rgba(4,4,26,0)');
  x.fillStyle = g; x.fillRect(0,0,s.w,s.h);
  for (const d of s.dust){ x.globalAlpha = d.a * (.7 + .3*Math.sin(time*.001 + d.ph)); x.fillStyle = '#fff'; x.beginPath(); x.arc(d.x,d.y,d.r,0,7); x.fill(); }
  for (const k of s.cons){
    const hl = s.sel && s.sel.date === k.date;
    x.globalAlpha = hl ? .75 : .22; x.strokeStyle = hl ? '#fbbf24' : '#c7d2fe'; x.lineWidth = hl ? 1.3 : .8;
    x.beginPath(); k.chain.forEach((p,i) => i ? x.lineTo(p.x,p.y) : x.moveTo(p.x,p.y)); x.stroke();
  }
  for (const st of s.stars){
    const tw = reduced ? 1 : .65 + .35*Math.sin(time*.0025 + st.ph);
    x.globalAlpha = tw; x.fillStyle = st.col; x.shadowColor = st.col; x.shadowBlur = st.r*5;
    x.beginPath(); x.arc(st.x, st.y, st.r, 0, 7); x.fill();
    if (st.kind !== 'task'){ x.globalAlpha = tw*.6; x.lineWidth = .8; x.strokeStyle = st.col; const L = st.r*3.5;
      x.beginPath(); x.moveTo(st.x-L,st.y); x.lineTo(st.x+L,st.y); x.moveTo(st.x,st.y-L); x.lineTo(st.x,st.y+L); x.stroke(); }
    x.shadowBlur = 0;
  }
  if (s.sel){ x.globalAlpha = 1; x.strokeStyle = '#fff'; x.lineWidth = 1.2; x.beginPath(); x.arc(s.sel.x, s.sel.y, s.sel.r + 7 + Math.sin(time*.005)*1.5, 0, 7); x.stroke(); }
  x.globalAlpha = 1;
  skyRaf = requestAnimationFrame(drawSky);
}
function openSky(){
  $('#sky').classList.add('open'); sky = null; layoutSky();
  cancelAnimationFrame(skyRaf); skyRaf = requestAnimationFrame(drawSky);
}
function closeSky(){ $('#sky').classList.remove('open'); cancelAnimationFrame(skyRaf); }
$('#skyBtn').onclick = openSky;
$('#skyClose').onclick = closeSky;
$('#skyCanvas').addEventListener('pointerdown', e => {
  if (!sky) return;
  let best = null, bd = 30;
  for (const st of sky.stars){ const d = Math.hypot(st.x - e.clientX, st.y - e.clientY); if (d < bd){ bd = d; best = st; } }
  sky.sel = best;
  if (best){
    const kind = best.kind === 'mission' ? '🌟 Миссия' : best.kind === 'goal' ? '🪐 Цель дня' : '✦ Задача';
    const cnt = sky.stars.filter(s => s.date === best.date).length;
    $('#skyTip').innerHTML = `<b>${esc(best.title)}</b><span class="sub">${kind} · ${esc(fmt(best.date,{day:'numeric',month:'long',year:'numeric'}))} · в созвездии ${cnt} ${plural(cnt,'звезда','звезды','звёзд')}</span>`;
  } else layoutSky();
});

// ================= ФОКУС (режим полёта) =================
const F = {taskId:null, dur:25, left:25*60, endsAt:0, running:false, timer:0, finished:false};
function fmtSec(s){ s = Math.max(0, Math.ceil(s)); return `${pad(Math.floor(s/60))}:${pad(s%60)}`; }
function openFocus(taskId){
  if (F.running && F.taskId !== taskId && taskId !== undefined){
    if (!confirm('Уже идёт полёт. Начать новый с этой задачей?')) { showFocus(); return; }
    stopFocus();
  }
  if (!F.running){ F.taskId = taskId; F.finished = false; if (!F.endsAt) F.left = F.dur*60; }
  showFocus();
}
function showFocus(){ $('#focus').classList.add('open'); renderFocus(); }
function closeFocus(){ $('#focus').classList.remove('open'); renderFocusPill(); }
function renderFocus(){
  const t = F.taskId && db.tasks.find(x => x.id === F.taskId);
  $('#fTask').textContent = t ? t.title : 'Свободный полёт';
  const left = F.running ? (F.endsAt - Date.now())/1000 : F.left, total = F.dur*60;
  const prog = Math.min(1, Math.max(0, 1 - left/total));
  $('#fTime').textContent = fmtSec(left);
  $('#fArc').setAttribute('d', prog > 0 ? arcPath(130, 0, prog*360) : '');
  const [dx,dy] = polar(130, prog*360); $('#fDot').setAttribute('cx', dx); $('#fDot').setAttribute('cy', dy);
  $('#fStart').textContent = F.running ? 'Пауза' : (F.left < total ? 'Продолжить' : 'Старт');
  $$('#fDur button').forEach(b => { b.classList.toggle('on', +b.dataset.m === F.dur); b.disabled = F.running || F.left < total; b.style.opacity = b.disabled && +b.dataset.m !== F.dur ? .4 : 1; });
  const today = db.focus.filter(f => f.date === todayIso()).reduce((a,f) => a + f.min, 0);
  if (F.finished){
    const tt = F.taskId && db.tasks.find(x => x.id === F.taskId);
    $('#fInfo').innerHTML = `<div class="done-msg">Полёт завершён! 🚀</div><div style="margin:6px 0 12px">Сегодня в фокусе: ${today} мин</div>${tt && !tt.done ? '<button class="btn" id="fDone">✓ Задача выполнена</button>' : ''}`;
    const b = $('#fDone'); if (b) b.onclick = () => { tt.done = true; tt.doneAt = Date.now(); save(); burst(b); F.finished = false; render(); setTimeout(closeFocus, 500); toast('Готово! Новая звезда на небе ✦'); };
  } else $('#fInfo').textContent = today ? `Сегодня в фокусе: ${today} мин` : 'Убери телефон экраном вниз. Одна задача — один полёт.';
  if (F.running) document.title = `${fmtSec(left)} · Орбита`; else document.title = 'Орбита';
  renderFocusPill();
}
function renderFocusPill(){
  const p = $('#fpill'), show = (F.running || (F.left < F.dur*60 && F.left > 0)) && !$('#focus').classList.contains('open');
  p.classList.toggle('hidden', !show);
  if (show) p.textContent = `${F.running ? '🚀' : '⏸'} ${fmtSec(F.running ? (F.endsAt - Date.now())/1000 : F.left)}`;
}
function tickFocus(){
  if (F.running && F.endsAt - Date.now() <= 0) return finishFocus();
  if ($('#focus').classList.contains('open')) renderFocus(); else { renderFocusPill(); if (F.running) document.title = `${fmtSec((F.endsAt - Date.now())/1000)} · Орбита`; }
}
function startFocus(){ F.endsAt = Date.now() + F.left*1000; F.running = true; F.finished = false; clearInterval(F.timer); F.timer = setInterval(tickFocus, 250); renderFocus(); }
function pauseFocus(){ F.left = Math.max(0, (F.endsAt - Date.now())/1000); F.running = false; clearInterval(F.timer); renderFocus(); }
function stopFocus(){ clearInterval(F.timer); F.running = false; F.endsAt = 0; F.left = F.dur*60; F.finished = false; }
function finishFocus(){
  clearInterval(F.timer); F.running = false; F.endsAt = 0; F.left = F.dur*60; F.finished = true;
  db.focus.push({id:uid(), taskId:F.taskId, min:F.dur, at:Date.now(), date:todayIso()}); save();
  if (navigator.vibrate) navigator.vibrate([200,100,200]);
  try { const ac = new (window.AudioContext || window.webkitAudioContext)(); [0,.18,.36].forEach((d,i) => { const o = ac.createOscillator(), g = ac.createGain(); o.frequency.value = [660,880,1320][i]; g.gain.setValueAtTime(.0001, ac.currentTime+d); g.gain.exponentialRampToValueAtTime(.2, ac.currentTime+d+.02); g.gain.exponentialRampToValueAtTime(.0001, ac.currentTime+d+.5); o.connect(g).connect(ac.destination); o.start(ac.currentTime+d); o.stop(ac.currentTime+d+.55); }); } catch {}
  showFocus(); render(); burst($('#fTime'));
}
$('#fStart').onclick = () => F.running ? pauseFocus() : startFocus();
$('#fReset').onclick = () => { stopFocus(); renderFocus(); };
$('#fClose').onclick = closeFocus;
$('#fpill').onclick = showFocus;
$('#fDur').onclick = e => { const b = e.target.closest('button'); if (!b || b.disabled) return; F.dur = +b.dataset.m; F.left = F.dur*60; renderFocus(); };

    <div class="field"><label>Тема</label><div class="themes" id="mTheme">
      <button data-t="dark" class="${th==='dark'?'on':''}"><i style="background:radial-gradient(circle at 70% 30%,#8b5cf6,transparent 60%),#06061a"></i>Космос</button>
      <button data-t="light" class="${th==='light'?'on':''}"><i style="background:radial-gradient(circle at 70% 30%,#f59e0b,transparent 60%),#fbf5ee"></i>Рассвет</button>
      <button data-t="auto" class="${th==='auto'?'on':''}"><i style="background:linear-gradient(90deg,#06061a 50%,#fbf5ee 50%)"></i>Авто</button></div></div>
    <div class="field"><label>Твоя вселенная</label><div class="stats">
      <div class="stat"><b>${skyItems().length}</b><span>звёзд</span></div>
      <div class="stat"><b>${Math.round(fm/60*10)/10}</b><span>часов фокуса</span></div>
      <div class="stat"><b>${db.notes.length}</b><span>заметок</span></div>
      <div class="stat"><b>${db.plans.filter(p=>p.archived).length}</b><span>миссий</span></div></div></div>
    <div class="field"><label>Резервная копия</label>
      <div class="sub" style="margin-bottom:8px">Всё хранится только на этом устройстве. Время от времени сохраняй копию в файл.</div>
      <div class="row"><button class="btn soft grow" id="mExport">⬇ Скачать копию</button>
      <label class="btn soft grow" style="text-align:center;cursor:pointer">⬆ Загрузить<input type="file" id="mImport" accept="application/json,.json" hidden></label></div></div>
    <div class="sub">Подсказка: клавиша <b>N</b> — быстро записать (на компьютере).</div>
    <div class="actions"><button class="btn danger" id="mWipe">Стереть всё</button><span class="grow"></span><button class="btn" id="mCancel">Готово</button></div>`);
  $('#mTheme').onclick = e => { const b = e.target.closest('button'); if (!b) return; db.settings.theme = b.dataset.t; save(); applyTheme(); $$('#mTheme button').forEach(x => x.classList.toggle('on', x === b)); render(); };
  $('#mExport').onclick = () => {
    const blob = new Blob([JSON.stringify(db, null, 2)], {type:'application/json'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `orbita-${todayIso()}.json`; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  };
  $('#mImport').onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    try {
      const data = JSON.parse(await f.text()); if (!data || !Array.isArray(data.tasks)) throw 0;
      if (!confirm('Заменить текущие данные данными из файла?')) return;
      db = normalize(data); save(); applyTheme(); closeModal(); render(); toast('Данные загружены');
    } catch { toast('Не получилось прочитать файл'); }
  };
  $('#mWipe').onclick = () => { if (confirm('Точно удалить ВСЕ данные? Это нельзя отменить.')){ db = empty(); save(); applyTheme(); closeModal(); render(); } };
};

// ================= старт =================
$$('.dock [data-view]').forEach(b => b.onclick = () => setView(b.dataset.view));
applyTheme();
setView('day');
let lastSeen = todayIso();
function dayTick(){
  const t = todayIso();
  if (t !== lastSeen){ if (curDay === lastSeen) curDay = t; lastSeen = t; render(); }
  else if (view === 'day' && !$('#modalBg').classList.contains('open')) { renderHeader(); renderOrbit(dayData()); }
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible'){ dayTick(); if (F.running) tickFocus(); } });
setInterval(dayTick, 60000);
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
</body>
</html>
