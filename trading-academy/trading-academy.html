<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Академия реального трейдинга</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@500;600;700&display=swap">
<style>/* Тёмный терминал: плотная сетка панелей, моноширинные цифры, один холодный акцент */
:root {
  --bg-0: #0a0e13; --bg-1: #10161d; --bg-2: #161e27; --bg-3: #1c2631; --chart-bg: #0c1117;
  --line: #1f2a35; --line-2: #2c3a48;
  --fg-1: #e7edf3; --fg-2: #9aabbc; --fg-3: #5f7183;
  --accent: #6ea8ff; --accent-2: #c792ea; --draw: #e8d27a;
  --up: #23c58e; --dn: #f0506e; --warn: #f2b544;
  --f-disp: 'Unbounded', 'Manrope', system-ui, sans-serif;
  --f-body: 'Manrope', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-mono: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  --r: 8px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--bg-0); color: var(--fg-1); }
body { font-family: var(--f-body); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg-1); }
button { font: inherit; color: inherit; cursor: pointer; }
button:disabled { cursor: not-allowed; opacity: .45; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
input[type=range] { width: 100%; accent-color: var(--accent); }
.up { color: var(--up); } .dn { color: var(--dn); } .warn { color: var(--warn); }
.muted { color: var(--fg-2); } .sm { font-size: 12px; } .mt { margin-top: 18px; }
.row { display: flex; align-items: center; } .gap { gap: 8px; } .wrap { flex-wrap: wrap; } .grow { flex: 1; min-width: 0; }
.eyebrow { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--fg-3); font-weight: 700; margin-bottom: 6px; }

.app { min-height: 100vh; display: flex; flex-direction: column; }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; align-items: center; gap: 16px; background: var(--bg-1); border-bottom: 1px solid var(--line); padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand b { font-family: var(--f-disp); font-weight: 600; font-size: 14px; letter-spacing: -.01em; display: block; line-height: 1.2; }
.brand span { font-size: 11px; color: var(--fg-3); }
.tabs { display: flex; gap: 4px; flex: 1; justify-content: center; flex-wrap: wrap; }
.tab { display: flex; align-items: center; gap: 8px; background: transparent; border: 1px solid transparent; border-radius: var(--r); padding: 6px 12px 6px 8px; color: var(--fg-2); }
.tab:hover { background: var(--bg-2); color: var(--fg-1); }
.tab.act { background: var(--bg-2); border-color: var(--line-2); color: var(--fg-1); }
.tab-n { width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center; font-family: var(--f-mono); font-size: 12px; background: var(--bg-3); color: var(--fg-2); }
.tab.act .tab-n { background: var(--accent); color: #08111f; font-weight: 700; }
.tab-t { display: flex; flex-direction: column; text-align: left; font-weight: 600; font-size: 13px; line-height: 1.2; }
.tab-t small { font-weight: 500; font-size: 11px; color: var(--fg-3); font-family: var(--f-mono); }
.me { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
.rank { font-family: var(--f-disp); font-size: 11px; padding: 3px 9px; border-radius: 99px; border: 1px solid var(--accent); color: var(--accent); }
.main { flex: 1; width: 100%; max-width: 1560px; margin: 0 auto; padding-block: 16px 24px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.foot { text-align: center; padding-block: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); border-top: 1px solid var(--line); }

.card { background: var(--bg-1); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; min-width: 0; }
.card-h { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
.btn { background: var(--accent); color: #08111f; border: 0; border-radius: 6px; padding: 8px 14px; font-weight: 700; font-size: 13px; }
.btn:hover:not(:disabled) { filter: brightness(1.1); }
.btn.ghost { background: var(--bg-2); color: var(--fg-1); border: 1px solid var(--line-2); font-weight: 600; }
.btn.wide { width: 100%; padding: 11px; margin-top: 8px; }
.btn.buy { background: var(--up); color: #04150e; } .btn.sell { background: var(--dn); color: #1d050b; }
.link { background: none; border: 0; color: var(--accent); padding: 0; font-weight: 600; }
.mini { background: var(--bg-2); border: 1px solid var(--line-2); border-radius: 5px; padding: 3px 8px; font-size: 12px; color: var(--fg-2); white-space: nowrap; }
.mini:hover { color: var(--fg-1); } .mini.on { border-color: var(--accent); color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent); }
.mini.danger { color: var(--dn); border-color: color-mix(in srgb, var(--dn) 50%, var(--line-2)); }
.inp { width: 100%; background: var(--bg-2); border: 1px solid var(--line-2); border-radius: 6px; color: var(--fg-1); padding: 7px 9px; font-family: var(--f-mono); font-size: 13px; font-variant-numeric: tabular-nums; }
.inp:focus { border-color: var(--accent); outline: none; }
.inp.xs { width: 86px; padding: 3px 6px; font-size: 12px; }
.inp.sl:focus { border-color: var(--dn); } .inp.tp:focus { border-color: var(--up); }
label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--fg-2); font-weight: 600; }
.pill { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 99px; background: var(--bg-3); color: var(--fg-2); font-weight: 600; white-space: nowrap; }
.pill.up { background: color-mix(in srgb, var(--up) 15%, transparent); color: var(--up); }
.pill.dn { background: color-mix(in srgb, var(--dn) 15%, transparent); color: var(--dn); }
.pill.ok { background: color-mix(in srgb, var(--up) 15%, transparent); color: var(--up); }
.chip { display: inline-block; padding: 5px 10px; border-radius: 6px; background: var(--bg-2); border: 1px solid var(--line-2); font-size: 13px; font-weight: 600; }
.empty { padding: 22px 8px; text-align: center; color: var(--fg-3); }
.empty.sm { padding: 10px 0; text-align: left; font-size: 12px; }
.notice { background: color-mix(in srgb, var(--warn) 10%, var(--bg-1)); border: 1px solid color-mix(in srgb, var(--warn) 35%, var(--line)); color: var(--fg-1); border-radius: var(--r); padding: 8px 12px; font-size: 12px; margin-bottom: 10px; }
.tabs-mini { display: flex; gap: 2px; background: var(--bg-2); border-radius: 6px; padding: 2px; flex-wrap: wrap; }
.tabs-mini button { background: none; border: 0; padding: 4px 10px; border-radius: 5px; color: var(--fg-2); font-size: 12px; font-weight: 600; font-family: var(--f-mono); }
.tabs-mini button.on { background: var(--bg-3); color: var(--fg-1); }
.tabs-mini.big { margin-bottom: 10px; display: inline-flex; }
.tabs-mini.big button { font-family: var(--f-body); font-size: 13px; padding: 6px 12px; }

/* ── Учебник */
.academy { display: grid; grid-template-columns: 320px minmax(0, 1fr); gap: 20px; align-items: start; }
.syllabus { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 72px); max-height: calc(100vh - 92px); overflow: auto; background: var(--bg-1); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; }
.syl-head { padding-bottom: 10px; border-bottom: 1px solid var(--line); margin-bottom: 8px; }
.syl-sum { font-family: var(--f-disp); font-size: 15px; margin-bottom: 8px; }
.bar { height: 6px; background: var(--bg-3); border-radius: 9px; overflow: hidden; margin-bottom: 6px; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 9px; transition: width .4s; }
.lvl { margin-top: 10px; }
.lvl-h { display: flex; justify-content: space-between; font-size: 12px; font-weight: 700; color: var(--fg-2); padding: 4px 6px; }
.les-item { width: 100%; display: grid; grid-template-columns: 24px 1fr auto; gap: 8px; align-items: center; background: none; border: 0; border-radius: 6px; padding: 6px; text-align: left; color: var(--fg-2); font-size: 13px; }
.les-item:hover { background: var(--bg-2); color: var(--fg-1); }
.les-item.act { background: var(--bg-3); color: var(--fg-1); }
.les-n { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-family: var(--f-mono); font-size: 11px; border: 1px solid var(--line-2); }
.les-item.done .les-n { background: var(--up); border-color: var(--up); color: #04150e; font-weight: 700; }
.les-m { font-family: var(--f-mono); font-size: 11px; color: var(--fg-3); }
.exam-item { margin-top: 12px; border: 1px dashed var(--line-2); }
.syl-toggle { display: none; margin-bottom: 12px; width: 100%; }
.les-main { min-width: 0; }
.lesson { max-width: 780px; }
.lesson h2 { font-family: var(--f-disp); font-weight: 600; font-size: clamp(22px, 3vw, 30px); line-height: 1.2; letter-spacing: -.02em; margin: 4px 0 16px; text-wrap: balance; }
.lesson h3 { font-family: var(--f-disp); font-weight: 500; font-size: 17px; margin: 22px 0 8px; }
.lesson p { margin: 0 0 12px; color: var(--fg-1); max-width: 68ch; font-size: 15px; line-height: 1.65; }
.lesson ul { margin: 0 0 14px; padding-left: 20px; max-width: 68ch; }
.lesson li { margin-bottom: 6px; font-size: 15px; line-height: 1.55; }
.lesson li::marker { color: var(--accent); }
.fig { margin: 0 0 18px; background: var(--chart-bg); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; }
.diagram { width: 100%; height: auto; display: block; max-width: 100%; }
.callout { border-radius: var(--r); padding: 12px 14px; margin: 14px 0; font-size: 14px; line-height: 1.55; background: var(--bg-1); border: 1px solid var(--line); max-width: 68ch; }
.callout b { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; margin-bottom: 4px; }
.callout.tip b { color: var(--up); } .callout.warn b { color: var(--warn); } .callout.ex b { color: var(--accent); }
.callout.warn { border-color: color-mix(in srgb, var(--warn) 35%, var(--line)); }
.keys { margin: 20px 0; } .key-row { display: flex; gap: 6px; flex-wrap: wrap; }
.quiz { display: flex; flex-direction: column; gap: 14px; }
.q { background: var(--bg-1); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; }
.q-t { font-weight: 700; margin-bottom: 10px; display: flex; gap: 10px; }
.q-n { flex: none; width: 22px; height: 22px; border-radius: 6px; background: var(--bg-3); display: grid; place-items: center; font-family: var(--f-mono); font-size: 12px; }
.q-opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 6px; }
.opt { text-align: left; background: var(--bg-2); border: 1px solid var(--line-2); border-radius: 6px; padding: 9px 11px; font-size: 14px; }
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt:disabled { cursor: default; opacity: 1; }
.opt.right { border-color: var(--up); background: color-mix(in srgb, var(--up) 14%, var(--bg-2)); }
.opt.wrong { border-color: var(--dn); background: color-mix(in srgb, var(--dn) 14%, var(--bg-2)); }
.opt.faded { opacity: .5; }
.q-why { margin-top: 8px; font-size: 13px; color: var(--fg-2); }
.q-why.ok { color: var(--up); } .q-why.bad { color: var(--dn); }
.task, .tool { background: var(--bg-1); border: 1px solid var(--line-2); border-radius: var(--r); padding: 14px; margin: 16px 0; }
.task p { margin-bottom: 10px; }
.task .inp { max-width: 180px; }
.grid4 { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-bottom: 10px; }
.calc-out { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; }
.calc-out div, .summary div, .stat-grid div { display: flex; flex-direction: column; background: var(--bg-2); border-radius: 6px; padding: 7px 9px; }
.calc-out span, .summary span, .stat-grid span { font-size: 11px; color: var(--fg-3); }
.calc-out b, .summary b, .stat-grid b { font-family: var(--f-mono); font-variant-numeric: tabular-nums; font-size: 14px; }
.les-nav { display: flex; justify-content: space-between; gap: 10px; margin-top: 26px; padding-top: 16px; border-top: 1px solid var(--line); flex-wrap: wrap; }
.les-nav .btn { max-width: 100%; white-space: normal; text-align: left; }
.exam-res { margin-top: 16px; padding: 14px; border-radius: var(--r); background: var(--bg-1); border: 1px solid var(--line-2); }
.exam-res b { font-family: var(--f-disp); font-size: 22px; }
.exam-res.ok b { color: var(--up); } .exam-res.bad b { color: var(--dn); }

/* ── График */
.chart-wrap { position: relative; width: 100%; user-select: none; touch-action: pan-y; }
.chart-svg { display: block; cursor: crosshair; }
.chart-svg.pick-on { cursor: copy; } .chart-svg.tool-on { cursor: cell; }
.chart-svg .grid { stroke: var(--line); stroke-width: 1; opacity: .7; }
.chart-svg .sep { stroke: var(--line-2); }
.chart-svg .ax { fill: var(--fg-3); font-size: 10px; font-family: var(--f-mono); }
.chart-svg .wm { fill: var(--fg-1); opacity: .04; font-size: 38px; font-family: var(--f-disp); font-weight: 700; }
.chart-svg .cu line { stroke: var(--up); } .chart-svg .cu rect { fill: var(--up); }
.chart-svg .cd line { stroke: var(--dn); } .chart-svg .cd rect { fill: var(--dn); }
.chart-svg .vol-up { fill: var(--up); opacity: .28; } .chart-svg .vol-dn { fill: var(--dn); opacity: .28; }
.chart-svg .cross { stroke: var(--fg-3); stroke-dasharray: 3 3; }
.chart-svg .tag { fill: #fff; font-size: 10.5px; font-family: var(--f-mono); font-weight: 600; }
.chart-svg .tagbg.up { fill: var(--up); } .chart-svg .tagbg.dn { fill: var(--dn); }
.chart-svg .lastl { stroke-dasharray: 2 3; stroke-width: 1; } .chart-svg .lastl.up { stroke: var(--up); } .chart-svg .lastl.dn { stroke: var(--dn); }
.chart-svg .ll { font-size: 10.5px; font-family: var(--f-mono); font-weight: 600; }
.chart-svg .zl { font-size: 10.5px; font-family: var(--f-body); font-weight: 700; }
.chart-svg .ml { font-size: 10.5px; font-family: var(--f-mono); font-weight: 700; }
.chart-svg .decision { stroke: var(--accent); stroke-dasharray: 4 4; }
.legend { position: absolute; top: 4px; left: 8px; display: flex; gap: 10px; font-family: var(--f-mono); font-size: 11px; color: var(--fg-3); pointer-events: none; flex-wrap: wrap; right: 80px; }
.legend b { font-weight: 500; }
.to-live { position: absolute; right: 76px; bottom: 30px; background: var(--bg-3); border: 1px solid var(--line-2); color: var(--fg-1); border-radius: 6px; font-size: 12px; padding: 4px 10px; }
.tool-hint { position: absolute; left: 50%; top: 26px; transform: translateX(-50%); background: var(--bg-3); border: 1px solid var(--draw); color: var(--draw); font-size: 12px; padding: 3px 10px; border-radius: 6px; pointer-events: none; white-space: nowrap; }
.chart-tools { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
.sep-v { width: 1px; height: 18px; background: var(--line-2); }
.chart-loading { height: 460px; display: grid; place-items: center; color: var(--fg-3); }

/* ── Кейсы */
.cases { display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 16px; align-items: start; }
.case-list { display: flex; flex-direction: column; gap: 4px; }
.case-chip { display: grid; grid-template-columns: 24px 1fr auto; gap: 8px; align-items: center; text-align: left; background: var(--bg-1); border: 1px solid var(--line); border-radius: var(--r); padding: 8px; }
.case-chip:hover { border-color: var(--line-2); }
.case-chip.act { border-color: var(--accent); }
.cc-n { width: 22px; height: 22px; border-radius: 6px; background: var(--bg-3); display: grid; place-items: center; font-family: var(--f-mono); font-size: 12px; }
.case-chip.done .cc-n { background: var(--up); color: #04150e; }
.cc-t { font-weight: 600; font-size: 13px; display: flex; flex-direction: column; line-height: 1.3; }
.cc-t small { color: var(--fg-3); font-weight: 500; font-size: 11px; }
.cc-s { font-family: var(--f-mono); font-weight: 700; }
.case-total { padding: 6px 4px; }
.case-body { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; align-items: start; }
.case-side p { margin: 0 0 14px; font-size: 14px; line-height: 1.6; }
.seg2, .seg3 { display: grid; gap: 4px; margin-bottom: 10px; }
.seg2 { grid-template-columns: 1fr 1fr; } .seg3 { grid-template-columns: 1fr 1fr 1fr; }
.seg-b { background: var(--bg-2); border: 1px solid var(--line-2); border-radius: 6px; padding: 9px 6px; font-weight: 700; font-size: 13px; color: var(--fg-2); }
.seg-b.on { color: var(--fg-1); border-color: var(--fg-2); background: var(--bg-3); }
.seg-b.long.on { background: color-mix(in srgb, var(--up) 20%, var(--bg-2)); border-color: var(--up); color: var(--up); }
.seg-b.short.on { background: color-mix(in srgb, var(--dn) 20%, var(--bg-2)); border-color: var(--dn); color: var(--dn); }
.stops-in { display: flex; flex-direction: column; gap: 8px; margin-bottom: 6px; }
.case-res p { font-size: 14px; }
.score-big { font-family: var(--f-disp); font-size: 44px; font-weight: 700; line-height: 1; margin-bottom: 8px; }
.score-big small { font-size: 16px; color: var(--fg-3); }
.res-line { font-size: 15px; margin-bottom: 12px; font-family: var(--f-mono); }

/* ── Терминал */
.term-top { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; background: var(--bg-1); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 14px; margin-bottom: 10px; }
.sym-block { display: flex; flex-direction: column; }
.sym-block b { font-family: var(--f-disp); font-size: 17px; font-weight: 600; }
.tk { display: flex; flex-direction: column; }
.tk span { font-size: 11px; color: var(--fg-3); }
.tk b { font-family: var(--f-mono); font-variant-numeric: tabular-nums; font-size: 14px; font-weight: 600; }
.conn { margin-left: auto; display: flex; align-items: center; gap: 6px; font-size: 12px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--fg-3); }
.dot.up { background: var(--up); box-shadow: 0 0 0 3px color-mix(in srgb, var(--up) 25%, transparent); }
.dot.warn { background: var(--warn); }
.player { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.speed { display: flex; background: var(--bg-2); border-radius: 6px; padding: 2px; }
.speed button { background: none; border: 0; padding: 6px 10px; border-radius: 5px; font-family: var(--f-mono); font-size: 12px; color: var(--fg-2); }
.speed button.on { background: var(--accent); color: #08111f; font-weight: 700; }
.pairs { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 10px; padding-bottom: 2px; }
.pair { flex: none; display: grid; grid-template-columns: auto auto; column-gap: 10px; text-align: left; background: var(--bg-1); border: 1px solid var(--line); border-radius: var(--r); padding: 6px 10px; font-family: var(--f-mono); font-size: 12px; }
.pair b { grid-column: 1 / 3; font-family: var(--f-body); font-size: 13px; }
.pair.act { border-color: var(--accent); }
.accbar { display: flex; gap: 6px; flex-wrap: wrap; align-items: stretch; margin-bottom: 10px; }
.acc-k { display: flex; flex-direction: column; background: var(--bg-1); border: 1px solid var(--line); border-radius: var(--r); padding: 6px 12px; min-width: 120px; }
.acc-k:first-child { border-color: var(--line-2); }
.acc-k span { font-size: 11px; color: var(--fg-3); }
.acc-k b { font-family: var(--f-mono); font-variant-numeric: tabular-nums; font-size: 15px; }
.acc-k:first-child b { font-size: 18px; }
.acc-reset { margin-left: auto; display: flex; align-items: center; }
.live-grid { display: grid; grid-template-columns: minmax(0, 1fr) 250px 300px; gap: 10px; margin-bottom: 10px; align-items: start; }
.trainer-grid { display: grid; grid-template-columns: minmax(0, 1fr) 310px; gap: 10px; margin-bottom: 10px; align-items: start; }
.book, .trades { font-family: var(--f-mono); font-size: 11.5px; font-variant-numeric: tabular-nums; margin-top: 8px; }
.book-h { display: grid; grid-template-columns: 1.1fr 1fr 1fr; color: var(--fg-3); font-size: 10.5px; padding: 0 4px 4px; }
.book-h span:not(:first-child), .book-r span:not(:first-child) { text-align: right; }
.book-r { position: relative; display: grid; grid-template-columns: 1.1fr 1fr 1fr; padding: 1.5px 4px; }
.book-r i { position: absolute; right: 0; top: 1px; bottom: 1px; opacity: .16; }
.book-r.ask span:first-child { color: var(--dn); } .book-r.ask i { background: var(--dn); }
.book-r.bid span:first-child { color: var(--up); } .book-r.bid i { background: var(--up); }
.book-r span { position: relative; }
.book-mid { display: flex; flex-direction: column; gap: 1px; padding: 6px 4px; margin: 4px 0; border-block: 1px solid var(--line); }
.book-mid b { font-size: 15px; }
.book-ratio { position: relative; display: flex; justify-content: space-between; margin-top: 8px; height: 18px; background: color-mix(in srgb, var(--dn) 25%, transparent); border-radius: 4px; overflow: hidden; font-size: 10.5px; align-items: center; padding: 0 6px; }
.book-ratio i { position: absolute; left: 0; top: 0; bottom: 0; background: color-mix(in srgb, var(--up) 25%, transparent); }
.book-ratio span { position: relative; font-weight: 700; }
.oform { display: flex; flex-direction: column; gap: 9px; }
.oform .seg2 { margin: 0; }
.quick { display: flex; gap: 4px; flex-wrap: wrap; }
.quick button { flex: 1; background: var(--bg-2); border: 1px solid var(--line); border-radius: 5px; padding: 4px 2px; font-size: 11px; font-family: var(--f-mono); color: var(--fg-2); white-space: nowrap; }
.quick button:hover { color: var(--fg-1); border-color: var(--line-2); }
.quick button.acc { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); }
.sltp { display: flex; flex-direction: column; gap: 6px; padding: 8px; border: 1px solid var(--line); border-radius: 6px; }
.sltp label.picking { color: var(--fg-1); }
.req { font-size: 10px; color: var(--warn); font-weight: 600; margin-left: 4px; }
.summary { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
.summary b { font-size: 12.5px; }
.warns { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.warns li { font-size: 12px; padding: 6px 8px; border-radius: 5px; background: var(--bg-2); border-left: 3px solid var(--fg-3); line-height: 1.4; }
.warns li.high { border-left-color: var(--dn); } .warns li.mid { border-left-color: var(--warn); } .warns li.low { border-left-color: var(--accent); }
.tbl-wrap { overflow-x: auto; }
.tbl { width: 100%; border-collapse: collapse; font-size: 12.5px; font-variant-numeric: tabular-nums; }
.tbl th { text-align: left; color: var(--fg-3); font-weight: 600; font-size: 11px; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl td { padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; font-family: var(--f-mono); white-space: nowrap; }
.tbl td.flags { white-space: normal; font-family: var(--f-body); min-width: 260px; }
.tbl td small { color: inherit; opacity: .8; }
.order-row td { opacity: .85; }
.flag { display: inline-block; font-size: 11px; padding: 2px 7px; margin: 0 4px 4px 0; border-radius: 4px; background: var(--bg-2); border-left: 2px solid var(--fg-3); }
.flag.high { border-left-color: var(--dn); } .flag.mid { border-left-color: var(--warn); } .flag.low { border-left-color: var(--accent); }
.grade { display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 6px; font-weight: 800; font-family: var(--f-disp); font-size: 12px; }
.gA { background: color-mix(in srgb, var(--up) 25%, transparent); color: var(--up); }
.gB { background: color-mix(in srgb, var(--up) 12%, transparent); color: var(--up); }
.gC { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
.gD, .gF { background: color-mix(in srgb, var(--dn) 20%, transparent); color: var(--dn); }
.edit-st { display: inline-flex; gap: 4px; margin-left: 4px; }
.stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 6px; margin-bottom: 14px; }
.stats-cols { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 16px; }
.flag-row { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
.flag-row b { font-family: var(--f-mono); color: var(--dn); }

@media (max-width: 1200px) {
  .live-grid { grid-template-columns: minmax(0, 1fr) 300px; }
  .live-grid .side-card { grid-column: 2; grid-row: 2; }
  .live-grid .form-card { grid-column: 2; grid-row: 1; }
  .live-grid .chart-card { grid-row: 1 / 3; }
  .case-body { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 900px) {
  .academy, .cases { grid-template-columns: minmax(0, 1fr); }
  .syllabus { position: static; max-height: none; display: none; }
  .syllabus.open { display: block; margin-bottom: 12px; }
  .syl-toggle { display: block; }
  .case-list { flex-direction: row; overflow-x: auto; }
  .case-chip { flex: none; width: 220px; }
  .live-grid, .trainer-grid { grid-template-columns: minmax(0, 1fr); }
  .live-grid .side-card, .live-grid .form-card, .live-grid .chart-card { grid-column: auto; grid-row: auto; }
  .stats-cols { grid-template-columns: minmax(0, 1fr); }
  .tabs { justify-content: flex-start; order: 3; width: 100%; flex-wrap: nowrap; overflow-x: auto; }
  .tab { flex: none; }
  .me { margin-left: auto; }
}
@media (max-width: 560px) {
  .hide-sm { display: none !important; }
  .brand span, .me { display: none; }
  .term-top { gap: 12px; }
  .acc-k { min-width: calc(50% - 3px); flex: 1; }
  .acc-reset { width: 100%; justify-content: flex-end; }
  .player { margin-left: 0; width: 100%; }
  .seg3 { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script>(()=>{var Bt=[{id:1,name:"Устройство рынка",rank:"Новичок",desc:"Откуда берётся цена, как читать свечи и какими ордерами торговать."},{id:2,name:"Технический анализ",rank:"Ученик",desc:"Тренд, уровни, ложные пробои, объём и индикаторы без фанатизма."},{id:3,name:"Риск-менеджмент",rank:"Трейдер",desc:"Математика выживания: 1% риска, RR, плечо, просадки."},{id:4,name:"Психология и система",rank:"Профи",desc:"FOMO, тильт, торговый план, журнал и путь на реальный рынок."}],V=[{id:"l1",level:1,title:"Стакан заявок: откуда берётся цена",min:15,diagram:"orderbook",body:[{p:"Цена на бирже — это не число, которое кто-то назначает. Это цена последней сделки между покупателем и продавцом. Все желающие купить и продать выставляют заявки, и биржа сводит их в стакан (order book)."},{h:"Bid, Ask и спред"},{list:["Bid — заявки на покупку. Лучший bid — самая высокая цена, по которой кто-то готов купить прямо сейчас.","Ask — заявки на продажу. Лучший ask — самая низкая цена, по которой кто-то готов продать.","Спред — разница между лучшим ask и лучшим bid. Чем ликвиднее рынок, тем спред уже."]},{p:"Лимитная заявка встаёт в стакан и ждёт. Она «даёт ликвидность». Рыночная заявка исполняется немедленно о встречные лимитные заявки — она «забирает ликвидность». Именно рыночные заявки двигают цену: когда покупатели по рынку выкупают весь объём на уровне ask, следующая сделка проходит уже выше."},{ex:"В стакане BTC: лучший bid 64 000,0, лучший ask 64 000,1. Спред 0,1 $ (0,0002%). У малоизвестной монеты спред может быть 0,5–1% — вы теряете это сразу при входе по рынку."},{tip:"Цена идёт туда, где агрессивные (рыночные) участники сильнее. Большая лимитная «стенка» не гарантирует разворот: её могут снять за секунду (спуфинг)."}],keys:["Цена = последняя сделка","Спред — ваша скрытая комиссия","Цену двигают рыночные ордера"],quiz:[{q:"Лучший bid 99,8, лучший ask 100,0. Чему равен спред?",o:["0,2","99,9","100,0","0,02"],a:0,why:"Спред = ask − bid = 100,0 − 99,8 = 0,2."},{q:"Кто «забирает» ликвидность из стакана?",o:["Лимитные заявки","Рыночные заявки","Маркет-мейкеры","Биржа"],a:1,why:"Рыночный ордер исполняется о стоящие лимитные заявки и убирает их из стакана."},{q:"Что такое последняя цена на графике?",o:["Средняя цена bid и ask","Цена последней совершённой сделки","Цена, назначенная биржей","Лучший bid"],a:1,why:"Свечи строятся по ценам сделок."}],task:{q:"Лучший bid 2 450,0, лучший ask 2 452,5. Сколько процентов цены вы теряете на спреде при мгновенной покупке и продаже? (от ask, до сотых)",answer:.1,tol:.015,unit:"%",solution:"(2452,5 − 2450) / 2452,5 × 100 ≈ 0,10%."}},{id:"l2",level:1,title:"Ликвидность и проскальзывание",min:12,diagram:"slippage",body:[{p:"Ликвидность — это сколько объёма можно купить или продать без сильного сдвига цены. Её видно по глубине стакана: сколько монет стоит на ближайших уровнях."},{p:"Если ваш рыночный ордер больше, чем объём на лучшей цене, он исполнится по нескольким уровням. Средняя цена входа окажется хуже — это проскальзывание."},{h:"Когда ликвидность пропадает"},{list:["Выход важных новостей (ставка ФРС, инфляция): маркет-мейкеры снимают заявки.","Ночные часы и выходные на тонких рынках.","Мелкие монеты с маленьким объёмом торгов.","Каскад ликвидаций: принудительные рыночные ордера сносят стакан."]},{warn:"Стоп-лосс — это рыночный ордер. На резком движении он может исполниться заметно хуже заявленной цены. Закладывайте это в риск."},{tip:"Крупные участники не могут войти одним ордером — им нужна встречная ликвидность. Её дают стопы толпы. Об этом в уроке про ложные пробои."}],keys:["Глубина стакана = ликвидность","Большой рыночный ордер = проскальзывание","На новостях ликвидность исчезает"],quiz:[{q:"Почему стоп-лосс на новостях может исполниться хуже указанной цены?",o:["Биржа берёт штраф","Стоп — рыночный ордер, а стакан пустеет","Стоп-лоссы исполняются с задержкой в минуту","Такого не бывает"],a:1,why:"Стоп превращается в рыночный ордер и исполняется по доступным заявкам."},{q:"Где проскальзывание при входе обычно меньше?",o:["На мелкой монете ночью","На BTC/USDT в активную сессию","Во время выхода новостей","На открытии выходных"],a:1,why:"Высокая ликвидность и плотный стакан."}],task:{q:"В стакане на продажу: 10 шт по 50,0 и 30 шт по 50,4. Вы покупаете по рынку 40 шт. Какая средняя цена входа?",answer:50.3,tol:.01,unit:"",solution:"(10×50,0 + 30×50,4) / 40 = 50,3."}},{id:"l3",level:1,title:"Японские свечи",min:15,diagram:"candle",body:[{p:"Каждая свеча показывает четыре цены за период: открытие (Open), максимум (High), минимум (Low) и закрытие (Close). Тело — между открытием и закрытием, тени — до максимума и минимума."},{list:["Зелёная (бычья) свеча: закрытие выше открытия.","Красная (медвежья): закрытие ниже открытия.","Длинная тень — цену туда пустили, но там её отвергли."]},{h:"Три модели, которые стоит знать"},{list:["Пин-бар: маленькое тело и длинная тень. Показывает отказ от цены. Важен только у уровня.","Поглощение: тело второй свечи полностью перекрывает тело первой. Смена инициативы.","Доджи: открытие ≈ закрытию. Нерешительность, часто перед сильным движением."]},{warn:"Модель свечи сама по себе ничего не значит. Пин-бар посреди боковика — шум. Пин-бар на ключевом уровне после выноса стопов — сигнал."},{ex:"Свеча 1h BTC: O 64 000, H 64 900, L 63 100, C 64 700. Тело 700 вверх, нижняя тень 900. Продавцы давили до 63 100, но покупатели выкупили всё и закрыли почти на максимуме — бычий отказ."}],keys:["OHLC — четыре цены свечи","Тень = отвергнутая цена","Контекст важнее модели"],quiz:[{q:"O 100, H 108, L 92, C 101. Что видно по свече?",o:["Сильный рост","Нерешительность: длинные тени, маленькое тело","Сильное падение","Ничего, свечу нельзя прочитать"],a:1,why:"Тело 1, тени по 7–8 — похоже на доджи."},{q:"Когда пин-бар имеет наибольший смысл?",o:["В середине боковика","На ключевом уровне после выноса стопов","На 1-минутке в любое время","Всегда одинаково"],a:1,why:"Сила модели в контексте."}],task:{q:"Свеча: O 50, H 58, L 41, C 56. Какова длина нижней тени?",answer:9,tol:.01,unit:"",solution:"Нижняя тень = min(O, C) − L = 50 − 41 = 9."}},{id:"l4",level:1,title:"Таймфреймы и анализ сверху вниз",min:12,diagram:"tf",body:[{p:"Таймфрейм (ТФ) — период одной свечи: 1m, 5m, 15m, 1h, 4h, 1D. Один и тот же рынок на разных ТФ выглядит по-разному: падение на 5m может быть откатом внутри роста на 4h."},{h:"Правило трёх таймфреймов"},{list:["Старший (1D/4h): общий тренд и главные уровни. Против него торгуют только опытные.","Рабочий (1h/15m): ищем сетап — откат к уровню, ложный пробой.","Младший (5m/1m): уточняем вход и ставим более короткий стоп."]},{tip:"Соотношение между ТФ примерно 1:4–1:6: 4h → 1h → 15m. Так контекст и детали не противоречат друг другу."},{warn:"Новички часто сидят на 1m: там больше всего шума, комиссий и эмоций. Начинайте с 1h–4h."}],keys:["Тренд смотрим на старшем ТФ","Вход ищем на рабочем","Младший ТФ — только уточнение"],quiz:[{q:"На 4h восходящий тренд, на 15m цена падает к поддержке. Что разумнее?",o:["Шортить падение","Искать лонг от поддержки","Купить сразу на хаях","Торговать только 1m"],a:1,why:"Падение на 15m — откат внутри старшего тренда."},{q:"Сколько 15-минутных свечей в одной 4-часовой?",o:["4","8","16","24"],a:2,why:"4 часа × 4 свечи в часе = 16."}]},{id:"l5",level:1,title:"Типы ордеров: лимит, маркет, стоп",min:12,diagram:"orders",body:[{list:["Market — исполнить сейчас по лучшей доступной цене. Гарантирует исполнение, но не цену.","Limit — купить не дороже / продать не дешевле указанной цены. Гарантирует цену, но не исполнение.","Stop (Stop-Market) — когда цена дойдёт до уровня, отправить рыночный ордер. Так работают стоп-лоссы и входы на пробой.","Stop-Limit — при срабатывании выставляет лимитный ордер. На гэпе может не исполниться.","Take-Profit — ордер на фиксацию прибыли на цели.","OCO — пара «стоп + тейк»: исполнится один, второй отменится."]},{ex:"Цена 100. Хотите купить на откате к 96 — Buy Limit 96. Хотите купить только если пробьют 104 — Buy Stop 104. Позиция открыта — сразу ставите Stop-Loss 93 и Take-Profit 110."},{warn:"Позиция без стоп-лосса — это ставка без ограничения убытка. В нашем терминале SL и TP обязательны."}],keys:["Market — скорость, Limit — цена","Стоп — защита и вход на пробой","Каждой позиции — SL и TP"],quiz:[{q:"Цена 50. Вы хотите купить, только если цена пробьёт 52. Какой ордер?",o:["Buy Limit 52","Buy Stop 52","Sell Limit 52","Market"],a:1,why:"Buy Limit выше рынка исполнится сразу. Нужен стоп-ордер на покупку."},{q:"Какой ордер гарантирует цену, но не исполнение?",o:["Market","Stop-Market","Limit","Любой"],a:2,why:"Лимит исполнится только по вашей цене или лучше."}]},{id:"l6",level:2,title:"Тренд и структура рынка",min:15,diagram:"trend",body:[{p:"Тренд — это не «цена растёт», а последовательность экстремумов. Восходящий: каждый максимум выше предыдущего (HH — higher high), каждый минимум тоже выше (HL — higher low). Нисходящий — наоборот: LH и LL."},{list:["Тренд продолжается, пока не нарушена структура.","Первый признак слома восходящего тренда — минимум ниже предыдущего HL.","Боковик (флэт): максимумы и минимумы на одном уровне, нет направления."]},{tip:"Самый простой рабочий сетап — вход по тренду на откате к последнему HL или уровню. Стоп за этот HL: если его пробьют, структура сломана и идея неверна."},{ex:"ETH: минимумы 2 900 → 3 050 → 3 180, максимумы 3 200 → 3 400 → 3 550. Тренд вверх. Цена откатывает к 3 300 — зона покупки со стопом под 3 180."}],keys:["Тренд = HH + HL","Слом = пробой последнего HL","Торгуем откаты по тренду"],quiz:[{q:"Минимумы: 10, 12, 11. Максимумы: 15, 17, 16. Что с трендом?",o:["Сильный рост","Структура сломана, возможен разворот или флэт","Падение ускоряется","Ничего не изменилось"],a:1,why:"Последний минимум ниже предыдущего — HL нарушен."},{q:"Где логично ставить стоп для лонга по восходящему тренду?",o:["На 0,1% ниже входа","Под последний HL","Над последним HH","Стоп не нужен"],a:1,why:"Пробой HL ломает тренд — идея больше не действует."}]},{id:"l7",level:2,title:"Уровни поддержки и сопротивления",min:15,diagram:"levels",body:[{p:"Уровень — это зона, где раньше были крупные покупки или продажи. Поддержка — снизу, на ней покупатели останавливали падение. Сопротивление — сверху, там продавцы останавливали рост."},{h:"Как строить уровни"},{list:["Ищите места с 2–3 и более касаниями или сильным разворотом.","Рисуйте зоной, а не тонкой линией: рынок не обязан разворачиваться до цента.","Круглые числа (60 000, 3 000) работают как психологические уровни.","Уровни старших ТФ сильнее уровней младших."]},{p:"Смена ролей: пробитое сопротивление часто становится поддержкой. Те, кто не успел купить на пробое, ждут возврата к уровню."},{warn:"Каждое следующее касание ослабляет уровень: заявки на нём съедаются. Пятое касание часто заканчивается пробоем."}],keys:["Уровень — зона прошлой активности","Рисуйте зонами","Пробитое сопротивление → поддержка"],quiz:[{q:"Цена пробила сопротивление 110 и откатила к нему. Что вероятнее всего ждут покупатели?",o:["Падения к нулю","Отскока от 110 как от поддержки","Ничего","Обязательного возврата под 100"],a:1,why:"Смена ролей уровня."},{q:"Почему уровень лучше рисовать зоной?",o:["Так красивее","Рынок разворачивается с разбросом, а не до цента","Так требует биржа","Зоны не нужны"],a:1,why:"Заявки распределены по диапазону цен."}]},{id:"l8",level:2,title:"Ложные пробои: где стоят стопы толпы",min:18,diagram:"fakeout",body:[{p:"Над очевидным сопротивлением скапливаются стоп-лоссы шортистов и buy-stop ордера тех, кто хочет «купить пробой». Под поддержкой — стопы лонгистов. Это скопления рыночных ордеров, то есть ликвидность."},{p:"Крупному участнику нужно продать большой объём. Ему выгодно, чтобы цена дошла до скопления buy-стопов: они сработают, превратятся в рыночные покупки, и он продаст им свой объём. После этого покупать некому — цена возвращается под уровень."},{h:"Признаки ложного пробоя"},{list:["Цена вышла за уровень тенью, но закрылась обратно внутри.","Нет продолжения: следующая свеча не обновляет экстремум.","Всплеск объёма на выходе за уровень — сработали стопы.","Пробой против тренда старшего ТФ."]},{tip:"Вход после ложного пробоя: в обратную сторону после закрытия свечи под уровнем. Стоп — за экстремум тени. Цель — противоположная граница диапазона."},{warn:"Не ставьте стоп ровно за очевидным уровнем или круглым числом. Добавляйте запас за зоной и экстремумом тени."}],keys:["Стопы толпы = ликвидность","Пробой тенью и возврат = ловушка","Стоп ставить за экстремум выноса"],quiz:[{q:"Где обычно скапливаются стопы покупателей?",o:["Над сопротивлением","Под поддержкой и под свежими минимумами","Ровно на текущей цене","Нигде"],a:1,why:"Лонгисты прячут стопы под минимумами и уровнями."},{q:"Цена проколола сопротивление тенью, свеча закрылась под ним с большим объёмом. Что это может значить?",o:["Надёжный пробой, покупать","Ложный пробой: стопы собраны, возможно падение","Ничего","Нужно добавить к лонгу"],a:1,why:"Возврат под уровень после выноса — классика ложного пробоя."},{q:"Куда поставить стоп для шорта после ложного пробоя вверх?",o:["Под уровень","Над максимумом тени выноса с запасом","На уровне входа","Стоп не нужен"],a:1,why:"Если цена обновит хай выноса, сценарий ложного пробоя отменён."}]},{id:"l9",level:2,title:"Объём: подтверждение движения",min:10,diagram:"volume",body:[{p:"Объём показывает, сколько было сделок за свечу. Цена говорит «что», объём — «насколько это серьёзно»."},{list:["Пробой на высоком объёме чаще продолжается.","Пробой на низком объёме часто ложный.","Падающий объём в тренде — участники теряют интерес, близок откат или разворот.","Аномальный объём на экстремуме после долгого движения — кульминация (капитуляция или эйфория)."]},{ex:"BTC пробивает 70 000, объём в 3 раза выше среднего за 20 свечей, свеча закрывается у максимума — сильный пробой. Если объём ниже среднего и свеча с длинной верхней тенью — велик риск возврата."}],keys:["Объём подтверждает пробой","Нет объёма — нет доверия","Аномальный объём на экстремуме — кульминация"],quiz:[{q:"Пробой уровня прошёл на объёме ниже среднего. Как к нему относиться?",o:["С подозрением: высок риск ложного пробоя","Как к лучшему сигналу","Объём не важен","Сразу входить на всю сумму"],a:0,why:"Без участия крупных денег пробой часто не удерживается."},{q:"Что часто означает огромный объём после долгого падения?",o:["Начало нового падения","Капитуляция — возможное дно","Ничего","Ошибку биржи"],a:1,why:"Последние продавцы сдаются, их выкупают."}]},{id:"l10",level:2,title:"Индикаторы: MA и RSI без фанатизма",min:12,diagram:"indicators",body:[{p:"Индикаторы — это формулы от цены. Они не видят будущего и всегда запаздывают. Используйте их как фильтр, а не как кнопку «купить»."},{h:"Скользящая средняя (MA / EMA)"},{list:["Цена выше MA 50 и MA наклонена вверх — работаем только в лонг.","MA 20 в сильном тренде часто служит динамической поддержкой.","В боковике MA пересекается каждые несколько свечей и бесполезна."]},{h:"RSI (индекс относительной силы)"},{list:["Выше 70 — перекупленность, ниже 30 — перепроданность.","В сильном тренде RSI может неделями держаться выше 70. Это не сигнал на шорт.","Полезна дивергенция: цена делает новый максимум, RSI — нет. Импульс слабеет."]},{warn:"5 индикаторов на графике не дают в 5 раз больше точности. Они рассчитаны из одной цены и показывают одно и то же."}],keys:["Индикаторы запаздывают","MA — фильтр направления","RSI > 70 в тренде — не повод шортить"],quiz:[{q:"RSI = 78, цена в сильном восходящем тренде. Верный вывод?",o:["Срочно шортить","Импульс сильный, перекупленность сама по себе не сигнал","RSI сломан","Продать всё"],a:1,why:"В тренде RSI долго держится в зоне перекупленности."},{q:"Цена обновила максимум, а RSI — нет. Это называется…",o:["Конвергенция","Медвежья дивергенция","Пересечение","Пробой"],a:1,why:"Импульс не подтверждает новый хай."}]},{id:"l11",level:3,title:"Правило 1% и размер позиции",min:18,diagram:"risk1",tool:"possize",body:[{p:"Главная задача трейдера — не заработать в одной сделке, а выжить достаточно долго, чтобы преимущество системы сработало. Для этого риск в одной сделке ограничивают 0,5–1% депозита."},{p:"Риск — это не сумма позиции. Это сколько вы потеряете, если сработает стоп. Размер позиции считается от стопа, а не наоборот."},{h:"Алгоритм"},{list:["1. Найдите место стопа по графику: за уровнем, за HL, за тенью выноса.","2. Посчитайте риск в деньгах: депозит × 1%.","3. Размер позиции = риск ÷ расстояние до стопа.","4. Проверьте, что позиция по номиналу не превышает разумного (с учётом плеча)."]},{ex:"Депозит $10 000, риск 1% = $100. BTC вход 64 000, стоп 62 720 (−2%). Размер = 100 ÷ 1 280 = 0,078 BTC ≈ $5 000. При стопе вы теряете $100, а не $5 000."},{tip:"10 убыточных сделок подряд при риске 1% = −9,6%. При риске 10% = −65%. Серии убытков случаются у всех."}],keys:["Риск на сделку 0,5–1%","Сначала стоп — потом размер","Размер = риск ÷ дистанция стопа"],quiz:[{q:"Депозит $5 000, риск 1%, вход 20, стоп 19. Сколько монет купить?",o:["50","250","5","2 500"],a:0,why:"Риск $50 ÷ дистанция 1 = 50 монет."},{q:"Что определяет место стопа?",o:["Сколько не жалко","Структура графика: где идея становится неверной","Круглое число процентов","Совет из чата"],a:1,why:"Стоп ставится туда, где сценарий отменяется. Размер подстраивается под стоп."}],task:{q:"Депозит $8 000, риск 1%. Вход в ETH 3 200, стоп 3 120. Сколько ETH в позиции? (до сотых)",answer:1,tol:.01,unit:"ETH",solution:"Риск $80 ÷ (3 200 − 3 120 = 80) = 1,00 ETH."}},{id:"l12",level:3,title:"Риск/прибыль и математическое ожидание",min:15,diagram:"expectancy",tool:"expectancy",body:[{p:"R — это единица риска. Если вы рискуете $100, то +2R — это +$100×2 = +$200, а −1R — потеря $100. Результаты считайте в R: так видна качество системы независимо от депозита."},{p:"Математическое ожидание (E) — средний результат одной сделки на дистанции: E = WR × RR − (1 − WR), где WR — доля прибыльных сделок, RR — средняя прибыль к риску."},{list:["WR 40% и RR 1:2 → E = 0,4×2 − 0,6 = +0,2R на сделку.","WR 60% и RR 1:0,5 → E = 0,3 − 0,4 = −0,1R. Часто выигрываете, но теряете деньги.","Безубыточный WR при RR 1:2 — 33%, при RR 1:3 — 25%."]},{tip:"Ищите сделки с RR от 1:2. Тогда можно ошибаться в 6 случаях из 10 и всё равно быть в плюсе."},{warn:"Не забывайте комиссии: при маленьких стопах они съедают значимую часть R."}],keys:["Считайте результат в R","E = WR×RR − (1−WR)","RR ≥ 1:2 прощает ошибки"],quiz:[{q:"WR 50%, RR 1:1,5. Чему равно матожидание?",o:["+0,25R","−0,25R","0","+1,5R"],a:0,why:"0,5×1,5 − 0,5 = 0,25R."},{q:"Какой минимальный винрейт нужен для безубыточности при RR 1:3?",o:["75%","50%","25%","10%"],a:2,why:"WR × 3 = 1 − WR → WR = 25%."}],task:{q:"Система: 35% прибыльных сделок со средним RR 1:2,5. Матожидание в R? (до сотых)",answer:.225,tol:.006,unit:"R",solution:"0,35 × 2,5 − 0,65 = 0,875 − 0,65 = 0,225R."}},{id:"l13",level:3,title:"Плечо и ликвидация",min:15,diagram:"leverage",tool:"leverage",body:[{p:"Плечо позволяет открыть позицию больше, чем ваш залог (маржа). С плечом 10x на $1 000 маржи вы держите позицию на $10 000. Прибыль и убыток считаются от всей позиции."},{p:"Ликвидация — принудительное закрытие позиции биржей, когда убыток почти съел маржу. При изолированной марже с плечом 10x это движение примерно на 9,5% против вас, с 20x — на ~4,5%, с 50x — на ~1,5%."},{h:"Главная мысль"},{list:["Плечо не меняет риск, если вы правильно считаете позицию от стопа. Оно меняет только залог.","Опасно не плечо, а размер позиции. 10x на весь депозит = риск всего депозита.","Стоп всегда должен стоять ближе к цене входа, чем ликвидация."]},{warn:"Высокое плечо + маленький стоп = стоп внутри обычного шума. Плечо 50–100x — это лотерея."},{ex:"Депозит $10 000. Лонг BTC на $5 000 со стопом −2%: риск $100 (1%). С плечом 1x нужно $5 000 залога, с 5x — $1 000. Риск одинаков: $100."}],keys:["Плечо меняет залог, а не риск","Стоп ближе ликвидации","Не используйте плечо больше 5–10x"],quiz:[{q:"Лонг с плечом 20x на изолированной марже. Примерно какое падение цены ликвидирует позицию?",o:["~20%","~4,5%","~50%","~0,5%"],a:1,why:"100% / 20 = 5%, минус поддерживающая маржа ≈ 4,5%."},{q:"Позиция $3 000, стоп −3%. Как меняется риск в $ при плече 3x вместо 1x?",o:["Растёт в 3 раза","Не меняется: $90","Падает в 3 раза","Становится нулевым"],a:1,why:"Риск = размер позиции × расстояние до стопа = $90. Плечо уменьшает только залог."}],task:{q:"Маржа $500, плечо 8x. Цена идёт против вас на 2%. Каков убыток в $?",answer:80,tol:.5,unit:"$",solution:"Позиция $4 000 × 2% = $80, это 16% маржи."}},{id:"l14",level:3,title:"Просадка и восстановление",min:10,diagram:"drawdown",body:[{p:"Потерять 50% депозита — значит для возврата нужно заработать уже 100%. Чем глубже просадка, тем сложнее выбраться: −80% требует +400%."},{list:["Дневной лимит убытка: −2…3% — закрываем терминал до завтра.","Недельный лимит: −5…6% — пауза и разбор журнала.","При просадке 10% снижайте риск на сделку вдвое, пока не вернётесь к пику."]},{tip:"Профессионалы думают о защите капитала больше, чем о прибыли. Прибыль — следствие выживания."}],keys:["−50% требует +100%","Дневной и недельный лимиты","В просадке риск снижают"],quiz:[{q:"Депозит упал на 25%. Сколько нужно заработать, чтобы вернуться?",o:["25%","33,3%","50%","20%"],a:1,why:"1 / 0,75 − 1 = 33,3%."},{q:"Что делать после 3 убытков подряд за день?",o:["Удвоить объём","Остановиться до завтра","Сменить стратегию на ходу","Убрать стопы"],a:1,why:"Дневной лимит защищает от тильта."}],task:{q:"Сколько процентов прибыли нужно после просадки −40%? (до десятых)",answer:66.7,tol:.8,unit:"%",solution:"1 / 0,6 − 1 = 0,667 → +66,7%."}},{id:"l15",level:4,title:"Психология: FOMO, жадность и страх",min:15,diagram:"emotions",body:[{p:"FOMO (fear of missing out) — страх упустить движение. Он заставляет покупать после большого роста, без сетапа и стопа, потому что «все зарабатывают»."},{list:["Вы входите после 3–5 сильных зелёных свечей подряд.","Вы не знаете, где стоп, и «поставите потом».","Вы увеличиваете объём, «потому что точно полетит».","Решение принято под влиянием чатов, новостей и чужих скриншотов."]},{p:"Цикл эмоций рынка повторяется: на эйфории покупает толпа, а крупные участники продают ей. На капитуляции — наоборот."},{tip:"Противоядие от FOMO — заранее записанный план. Если движения нет в вашем плане, это не ваше движение. Рынок даст новый сетап завтра."},{warn:"Страх тоже вредит: преждевременное закрытие прибыльных сделок убивает RR. Двигайте стоп по правилам, а не по эмоциям."}],keys:["FOMO = вход без плана","Толпа покупает на эйфории","План важнее ощущений"],quiz:[{q:"Монета выросла на 40% за день, в чатах пишут «на луну». Ваш план не предусматривал входа. Что делать?",o:["Купить по рынку на всё","Пропустить и ждать сетап по плану","Купить с плечом 20x","Шортить без стопа"],a:1,why:"Вход на эмоциях после вертикального роста — классический FOMO."},{q:"Какой признак говорит о FOMO?",o:["Вход по заранее записанному сетапу","Вход без понимания, где стоп","Риск 1%","Ведение журнала"],a:1,why:"Нет стопа = нет плана."}]},{id:"l16",level:4,title:"Тильт и «отыгрывание»",min:10,diagram:"tilt",body:[{p:"Тильт — состояние, когда после убытка вы торгуете эмоционально: хотите «вернуть своё». Сделки становятся больше, стопы — шире или исчезают, сетапы — случайными."},{list:["Новая сделка сразу после стопа, в ту же или противоположную сторону.","Отодвигание стопа «чуть-чуть, сейчас развернётся».","Усреднение убыточной позиции.","Рост объёма после убытков."]},{tip:"Правило: после стопа — 15 минут без торговли. После 2–3 убытков или −3% за день — стоп-день."},{p:"Наш терминал отмечает «сделку мести»: вход в течение 3 минут после убыточного закрытия. Это одна из ошибок в разборе."}],keys:["Тильт — торговля ради отыгрыша","Пауза после стопа","Стоп-день по лимиту"],quiz:[{q:"Сработал стоп. Вы сразу открываете сделку вдвое больше. Как это называется?",o:["Пирамидинг","Revenge trading (сделка мести)","Хеджирование","Скальпинг"],a:1,why:"Попытка отыграться — признак тильта."},{q:"Цена подошла к стопу. Правильное действие?",o:["Отодвинуть стоп","Ничего, стоп делает свою работу","Усредниться","Убрать стоп"],a:1,why:"Стоп ставится один раз по логике рынка."}]},{id:"l17",level:4,title:"Торговый план и журнал",min:15,diagram:"plan",body:[{p:"Торговый план — письменные правила: что, когда и как вы торгуете. Без него невозможно понять, что сломалось: система или дисциплина."},{list:["Рынки и таймфреймы (например, BTC и ETH, 4h + 1h).","1–2 сетапа с чёткими условиями входа.","Правила стопа, цели и сопровождения.","Риск на сделку, дневной и недельный лимиты.","Время торговли и условия, когда не торгуете (новости, усталость)."]},{h:"Журнал"},{p:"Каждая сделка записывается: сетап, вход, стоп, цель, результат в R, соблюдён ли план, эмоция. Раз в неделю считайте статистику: винрейт, средний R, матожидание, частые ошибки."},{tip:"Вкладка «Live-терминал» ведёт журнал автоматически и подсвечивает ошибки риск-менеджмента."}],keys:["План записан до сделки","Журнал — данные, а не память","Анализ по выборке 20+ сделок"],quiz:[{q:"Зачем вести журнал?",o:["Для отчёта перед брокером","Чтобы на данных видеть, где теряете деньги","Он не нужен","Чтобы показывать друзьям"],a:1,why:"Память искажает, журнал — нет."},{q:"Минимальная выборка, по которой можно судить о системе?",o:["1 сделка","3 сделки","20–30+ сделок","1 день"],a:2,why:"На малой выборке результат — в основном случайность."}]},{id:"l18",level:4,title:"Путь на реальный рынок",min:12,diagram:"path",body:[{p:"Последовательность обучения: теория → разбор кейсов → тренажёр → демо-счёт → маленький реальный счёт → постепенное масштабирование. Каждый шаг закрывайте по критерию, а не по ощущению."},{list:["Тренажёр: 100+ сделок, положительное матожидание в R.","Live-терминал (виртуальные деньги, реальные котировки): 50+ сделок, без нарушений риска, просадка < 10%.","Реальный счёт: сумма, потерю которой вы спокойно переживёте. Риск 0,5%.","Масштабирование: увеличивайте депозит только после 3 месяцев стабильного плюса."]},{warn:"Реальные деньги меняют психологию. Даже прибыльный на демо трейдер часто теряет первые месяцы. Начинайте с минимальных сумм."},{tip:"Ни один курс и ни один сигнал не заменит вашу статистику. Ваш журнал — главный учитель."}],keys:["Каждый этап — по критерию","Демо 50+ сделок без нарушений","Реальный старт с минимальной суммы"],quiz:[{q:"Когда переходить с демо на реальный счёт?",o:["После первой прибыльной сделки","После 50+ сделок с положительным матожиданием без нарушений риска","Сразу","Когда надоест демо"],a:1,why:"Нужна статистика на дистанции."},{q:"Какой риск на сделку разумен на первом реальном счёте?",o:["5%","0,5%","20%","Весь депозит"],a:1,why:"Новая психология требует запаса."}]}],Pe=V.reduce((e,s)=>e+s.min,0);var h=({x:e,y:s,children:t,c:i="var(--fg-2)",s:n=11,a="start",w:l=400})=>React.createElement("text",{x:e,y:s,fill:i,fontSize:n,textAnchor:a,fontWeight:l,fontFamily:"var(--f-body)"},t),K=({children:e,h:s=240})=>React.createElement("svg",{viewBox:`0 0 560 ${s}`,className:"diagram",role:"img"},e),nt=({x:e,o:s,c:t,h:i,l:n,w:a=14})=>{let l=t<=s;return React.createElement("g",null,React.createElement("line",{x1:e,x2:e,y1:i,y2:n,stroke:l?"var(--up)":"var(--dn)",strokeWidth:"1.5"}),React.createElement("rect",{x:e-a/2,y:Math.min(s,t),width:a,height:Math.max(2,Math.abs(t-s)),fill:l?"var(--up)":"var(--dn)",rx:"1"}))},pt=({d:e,c:s="var(--fg-1)",w:t=2,dash:i})=>React.createElement("path",{d:e,fill:"none",stroke:s,strokeWidth:t,strokeDasharray:i,strokeLinejoin:"round"});function vs(){let e=[[101.5,40],[101.3,75],[101.2,30],[101.1,55],[101,22]],s=[[100.9,35],[100.8,60],[100.7,90],[100.6,28],[100.5,50]];return React.createElement(K,{h:260},React.createElement(h,{x:20,y:20,c:"var(--fg-1)",s:12,w:600},"Стакан заявок"),React.createElement(h,{x:20,y:36,s:10},"цена · объём (лимитные заявки)"),e.map(([t,i],n)=>React.createElement("g",{key:t},React.createElement("rect",{x:120,y:46+n*18,width:i*1.6,height:15,fill:"var(--dn)",opacity:"0.22"}),React.createElement(h,{x:20,y:58+n*18,c:"var(--dn)",s:11},t.toFixed(1)),React.creat
