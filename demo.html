<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Демо-сайт</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;font:16px/1.5 system-ui,sans-serif;background:#f5f3ef;color:#222;padding:24px;text-align:center}
</style>
</head>
<body>
<div id="msg">Загружаю сайт…</div>
<script src="js/demo-render.js"></script>
<script>
(async () => {
  const raw = location.hash.slice(1);
  if (!raw) { document.getElementById('msg').textContent = 'Ссылка неполная: в ней нет данных сайта.'; return; }
  try {
    const data = await DemoSite.unpack(raw);
    const html = DemoSite.render(data);
    document.open(); document.write(html); document.close();
  } catch (e) {
    document.getElementById('msg').textContent = 'Не получилось открыть демо. Попросите прислать ссылку ещё раз.';
  }
})();
</script>
</body>
</html>
